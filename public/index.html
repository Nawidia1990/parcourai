// Fallback URLs for well-known job platforms — filled in client-side whenever the AI
// recognizes the platform by name but doesn't supply (or omits) a URL, so links show up
// reliably rather than depending entirely on the model including one every time.
// ---------- Voice recording (interview practice) ----------
// Deliberately kept OUTSIDE the persisted `state` object: recordings are audio Blobs, which
// don't belong in the string-based storage layer (size limits, wrong data type) and aren't
// meant to survive a reload anyway — this is a practice tool, not a permanent archive.
// Keyed by a stable string per question/pitch so re-renders don't lose an in-progress recording.
const voiceRecordings = {};

async function startVoiceRecording(key){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm'))
      ? 'audio/webm' : '';
    const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
    const chunks = [];
    recorder.ondataavailable = (e)=>{ if(e.data && e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = ()=>{
      const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
      const blobUrl = URL.createObjectURL(blob);
      voiceRecordings[key] = { status:'recorded', blobUrl, mimeType: blob.type };
      stream.getTracks().forEach(tr=>tr.stop());
      render();
    };
    voiceRecordings[key] = { status:'recording', mediaRecorder: recorder };
    recorder.start();
    render();
  }catch(e){
    toast(t('micPermissionError'));
  }
}

function stopVoiceRecording(key){
  const rec = voiceRecordings[key];
  if(rec && rec.status==='recording' && rec.mediaRecorder){
    rec.mediaRecorder.stop();
  }
}

function discardVoiceRecording(key){
  const rec = voiceRecordings[key];
  if(rec && rec.blobUrl) URL.revokeObjectURL(rec.blobUrl);
  delete voiceRecordings[key];
  render();
}

function downloadVoiceRecording(key, filename){
  const rec = voiceRecordings[key];
  if(!rec || !rec.blobUrl) return;
  const a = document.createElement('a');
  a.href = rec.blobUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function voiceRecorderHtml(key){
  const rec = voiceRecordings[key];
  const status = rec ? rec.status : 'idle';
  if(status === 'recording'){
    return `
      <div class="chip-row" style="margin-top:8px;">
        <button class="btn btn-ghost btn-sm" data-stop-recording="${key}" style="color:var(--danger);border-color:var(--danger);">⏺ ${esc(t('recordingInProgress'))} — ${esc(t('stopRecording'))}</button>
      </div>
    `;
  }
  if(status === 'recorded'){
    return `
      <div style="margin-top:8px;">
        <audio controls src="${rec.blobUrl}" style="width:100%;max-width:340px;height:32px;"></audio>
        <div class="chip-row" style="margin-top:6px;">
          <button class="btn btn-ghost btn-sm" data-rerecord="${key}">${esc(t('reRecord'))}</button>
          <button class="btn btn-ghost btn-sm" data-download-recording="${key}">${esc(t('downloadRecording'))}</button>
        </div>
      </div>
    `;
  }
  return `
    <div class="chip-row" style="margin-top:8px;">
      <button class="btn btn-ghost btn-sm" data-start-recording="${key}">🎙 ${esc(t('recordAnswer'))}</button>
    </div>
  `;
}

async function buildTranslatedStrategyReport(targetLangCode){
  const s = state.jobStrategy;
  const H = STRATEGY_REPORT_HEADERS[targetLangCode] || STRATEGY_REPORT_HEADERS.en;
  const targetLangName = targetLangCode === 'fr' ? 'French' : 'English';

  const payload = {
    narrative: s.narrative || '',
    platforms: s.platforms.map(p=>({name:p.name, url:p.url||'', region:p.region, why:p.why})),
    keywords: s.keywords || [],
    weeklyPlan: s.weeklyPlan || [],
    networkingTips: s.networkingTips || [],
    marketNotes: s.marketNotes || []
  };

  let translated = payload;
  const hasContent = payload.narrative || payload.platforms.length || payload.keywords.length;
  if(hasContent){
    const prompt = `Translate every text value in this JSON object into ${targetLangName}. If a value is already entirely in ${targetLangName}, leave it exactly as-is. Keep the exact same JSON structure and keys. Keep proper nouns and platform names (e.g. "LinkedIn", "EURES") untranslated. Respond with a JSON object only (no markdown fences, no preamble), same shape as the input:

${JSON.stringify(payload, null, 2)}`;
    try{
      const raw = await callClaude(prompt, "You always respond with a single valid JSON object matching the input's structure, and nothing else.", 8000);
      translated = JSON.parse(stripFences(raw));
    }catch(e){
      translated = payload;
    }
  }

  const blocks = [];
  if(translated.narrative) blocks.push(H.overview + '\n' + translated.narrative);
  if(translated.platforms && translated.platforms.length){
    blocks.push(H.platforms + '\n' + translated.platforms.map(p=>`${p.name}${p.url?' — '+p.url:''} (${p.region}) — ${H.why}: ${p.why}`).join('\n'));
  }
  if(translated.keywords && translated.keywords.length) blocks.push(H.keywords + '\n' + translated.keywords.join(', '));
  if(translated.weeklyPlan && translated.weeklyPlan.length) blocks.push(H.weekly + '\n' + translated.weeklyPlan.map(x=>'• '+x).join('\n'));
  if(translated.networkingTips && translated.networkingTips.length) blocks.push(H.networking + '\n' + translated.networkingTips.map(x=>'• '+x).join('\n'));
  if(translated.marketNotes && translated.marketNotes.length) blocks.push(H.market + '\n' + translated.marketNotes.map(x=>'• '+x).join('\n'));
  return blocks.join('\n\n');
}

// ---------- Claude API ----------
async function callClaude(promptText, system, maxTokens){
  const body = { model:"claude-sonnet-5", max_tokens: maxTokens || 4000, messages:[{role:"user", content: promptText}] };
  if(system) body.system = system;
  const resp = await fetch("/api/generate", {
    method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)
  });
  const data = await resp.json();
  if(!resp.ok){
    // Surface Anthropic's/the proxy's actual error message rather than masking
    // it — a previous version of this function silently fell through to
    // calling api.anthropic.com directly from the browser on any non-OK
    // response, which always fails with CORS in production (no API key is
    // exposed client-side, by design) and showed a misleading "Failed to
    // fetch" instead of the real reason the request was rejected.
    throw new Error((data && data.error && (data.error.message || data.error)) || ("API error " + resp.status));
  }
  return data.content.map(b => b.text || "").join("\n");
}

function stripFences(t){
  t = t.replace(/```json|```/g, "").trim();
  // Some responses contain a literal newline/tab/CR inside a JSON string value instead of
  // the properly escaped \n \t \r — that's invalid JSON and throws "Bad control character".
  // Separately, a response can contain a stray, unescaped double-quote INSIDE what was meant
  // to be string content (e.g. the model quoting a phrase without escaping it) — that closes
  // the JSON string early and throws "Unterminated string" once everything after it stops
  // making sense as JSON. Walk the text tracking whether we're inside a string literal,
  // repairing both cases, without touching structural whitespace/quotes between tokens.
  let result = '';
  let inString = false;
  let escapeNext = false;
  for(let i=0; i<t.length; i++){
    const ch = t[i];
    if(escapeNext){ result += ch; escapeNext = false; continue; }
    if(ch === '\\' && inString){ result += ch; escapeNext = true; continue; }
    if(ch === '"'){
      if(inString){
        // Peek past any whitespace to see what follows this quote. A real closing
        // quote is followed by a structural JSON character; anything else means
        // this quote was stray content inside the string, not a real terminator.
        let j = i + 1;
        while(j < t.length && /\s/.test(t[j])) j++;
        const next = t[j];
        const looksLikeRealClose = next === undefined || [',', '}', ']', ':'].includes(next);
        if(looksLikeRealClose){ inString = false; result += ch; continue; }
        result += '\\"';
        continue;
      }
      inString = true; result += ch; continue;
    }
    if(inString){
      if(ch === '\n'){ result += '\\n'; continue; }
      if(ch === '\r'){ result += '\\r'; continue; }
      if(ch === '\t'){ result += '\\t'; continue; }
    }
    result += ch;
  }
  return result;
}

// ---------- Render ----------
function render(){
  const root = document.getElementById('root');
  if(!state.loaded){
    root.innerHTML = `<div class="app"><div style="margin:auto;padding:60px;color:var(--muted);font-family:var(--font-body)">Loading…</div></div>`;
    return;
  }
  if(state.publicPage){
    root.innerHTML = publicPageWrapper();
    bindPublicPageEvents();
    return;
  }
  if(!state.currentUser && state.showStaffLogin){
    root.innerHTML = staffLoginPage();
    bindStaffLoginEvents();
    return;
  }
  if(state.currentUser && state.showStaffLogin){
    // Already signed in and came here via the footer link or a bookmark —
    // no need to show a login form to someone already authenticated. Send
    // staff straight to their dashboard; quietly drop anyone else into their
    // normal view, since this link simply isn't meant for them.
    state.showStaffLogin = false;
    if(hasStaffAccess()) state.tab = 'staff';
    history.pushState({}, '', '/');
  }
  if(!state.currentUser){
    if(state.showLanding){
      root.innerHTML = landingPage();
      bindLandingEvents();
      return;
    }
    root.innerHTML = loginPage();
    bindLoginEvents();
    return;
  }
  root.innerHTML = `
    <div class="app">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <div class="mobile-sidebar-overlay ${state.ui.mobileSidebarOpen?'active':''}" id="mobile-sidebar-overlay"></div>

        ${state.tab==='profile' ? profilePage() : ''}
        ${state.tab==='discovery' ? discoveryPage() : ''}
        ${state.tab==='skills' ? skillsPage() : ''}
        ${state.tab==='analyzer' ? analyzerPage() : ''}
        ${state.tab==='applications' ? applicationsPage() : ''}
        ${state.tab==='interview' ? interviewPage() : ''}
        ${state.tab==='accounts' ? accountsPage() : ''}
        ${state.tab==='strategy' ? strategyPage() : ''}
        ${state.tab==='chat' ? chatPage() : ''}
        ${state.tab==='improvement' ? improvementPage() : ''}
        ${state.tab==='social' ? socialMediaPage() : ''}
        ${state.tab==='languages' ? languagesPage() : ''}

function publicPageWrapper(){
  const backAction = state.currentUser ? 'app-back' : 'landing-back';
  let content, pageTitle, pageDescription;
  if(state.publicPage === 'privacy'){
    content = privacyPolicyContent(); pageTitle = 'Privacy Policy — Parcourai'; pageDescription = '';
  } else if(state.publicPage === 'terms'){
    content = termsContent(); pageTitle = 'Terms & Conditions — Parcourai'; pageDescription = '';
  } else if(state.publicPage === 'blog'){
    content = blogListingContent(); pageTitle = (state.uiLang==='fr' ? 'Blogue' : 'Blog') + ' — Parcourai'; pageDescription = state.uiLang==="fr" ? "Conseils pratiques pour votre recherche d'emploi bilingue au Canada." : "Practical advice for your bilingual job search in Canada.";
  } else if(state.publicPage && state.publicPage.startsWith('blog:')){
    const slug = state.publicPage.slice(5);
    const article = BLOG_ARTICLES[slug] && BLOG_ARTICLES[slug][state.uiLang === 'fr' ? 'fr' : 'en'];
    content = blogArticleContent(slug);
    pageTitle = article ? article.title + ' — Parcourai' : 'Parcourai';
    pageDescription = article ? article.metaDescription : '';
  } else {
    content = contactPageContent(); pageTitle = 'Contact — Parcourai'; pageDescription = '';
  }

  // Basic SEO hygiene within what a client-rendered single-page app can actually
  // do: update the document title and meta description per page. Worth being
  // upfront that this alone doesn't solve everything a fully server-rendered
  // site would for search visibility — search engines increasingly execute
  // JavaScript, but server-rendered content is still generally indexed more
  // reliably and quickly than content injected client-side.
  document.title = pageTitle;
  let metaDesc = document.querySelector('meta[name="description"]');
  if(!metaDesc){
    metaDesc = document.createElement('meta');
    metaDesc.setAttribute('name', 'description');
    document.head.appendChild(metaDesc);
  }
  if(pageDescription) metaDesc.setAttribute('content', pageDescription);

  return `

function bindPublicPageEvents(){
  document.querySelectorAll('[data-ui-lang]').forEach(b=>{
    b.onclick = ()=>{ state.uiLang = b.dataset.uiLang; render(); };
  });
  const landingBack = document.getElementById('landing-back');
  if(landingBack) landingBack.onclick = ()=>{ state.showLanding = true; navigateToPublicPage(null); };
  const appBack = document.getElementById('app-back');
  if(appBack) appBack.onclick = ()=>{ navigateToPublicPage(null); };
  document.querySelectorAll('[data-goto-contact]').forEach(a=>{
    a.onclick = ()=>{ navigateToPublicPage('contact'); };
  });
  document.querySelectorAll('[data-goto-blog]').forEach(a=>{
    a.onclick = ()=>{ navigateToPublicPage('blog'); };
  });
  document.querySelectorAll('[data-goto-blog-article]').forEach(a=>{
    a.onclick = ()=>{ navigateToPublicPage('blog:' + a.dataset.gotoBlogArticle); };
  });
  document.querySelectorAll('[data-goto-public]').forEach(a=>{
    a.onclick = ()=>{ navigateToPublicPage(a.dataset.gotoPublic); };
  });
  const staffLoginLink = document.getElementById('staff-login-link');
  if(staffLoginLink) staffLoginLink.onclick = navigateToStaffLogin;
  const cn = document.getElementById('contact-name');
  const ce = document.getElementById('contact-email');
  const cm = document.getElementById('contact-message');
  if(cn) cn.oninput = ()=>{ state.contactForm.name = cn.value; };
  if(ce) ce.oninput = ()=>{ state.contactForm.email = ce.value; };
  if(cm) cm.oninput = ()=>{ state.contactForm.message = cm.value; };
  const contactForm = document.getElementById('contact-form-submit');
  if(contactForm) contactForm.onclick = submitContactForm;
}

async function submitContactForm(){
  const cf = state.contactForm;
  cf.error = ""; cf.success = "";
  if(!cf.name.trim()){ cf.error = state.uiLang==='fr' ? "Veuillez entrer votre nom." : "Please enter your name."; render(); return; }
  if(!isValidEmail(normUsername(cf.email))){ cf.error = state.uiLang==='fr' ? "Entrez une adresse courriel valide." : "Enter a valid email address."; render(); return; }
  if(!cf.message.trim()){ cf.error = state.uiLang==='fr' ? "Veuillez entrer un message." : "Please enter a message."; render(); return; }
  cf.busy = true; render();
  try{
    await window.firebaseSubmitContactMessage({ name: cf.name.trim(), email: normUsername(cf.email), message: cf.message.trim() });
    state.contactForm = { name:"", email:"", message:"", error:"", busy:false, success: state.uiLang==='fr' ? "Message envoyé — merci de nous avoir écrit!" : "Message sent — thanks for reaching out!" };
  }catch(e){
    console.error('Contact form submission failed:', e);
    cf.error = state.uiLang==='fr' ? "Impossible d'envoyer le message — veuillez réessayer ou nous écrire directement." : "Couldn't send the message — please try again or email us directly.";
    cf.busy = false;
  }
  render();
}

const BLOG_ARTICLES = {

    en: {
      title: "How to Adapt Your Résumé for Quebec's Bilingual Job Market",
      metaDescription: "Practical tips for tailoring your résumé to Quebec's bilingual job market — language choice, common mistakes, and what employers actually look for.",
      date: "August 30, 2026",
      content: `
        <p>Quebec's job market works differently than the rest of Canada. French isn't just common here — it's the primary working language for most roles, and it's protected by provincial language law. If you're job hunting in Quebec, your résumé needs to reflect that reality, not just mention French as a checkbox skill.</p>
        <h2>Should your résumé be in French or English?</h2>
        <p>For most Quebec-based roles outside of purely anglophone sectors — some tech startups, certain multinationals — a French résumé is the default expectation, even if the job itself involves some English. If you're genuinely bilingual, the strongest position is having both versions ready, each written natively in that language rather than translated word-for-word from the other. A recruiter can usually tell the difference, and it matters more than you'd think.</p>
        <h2>The mistake almost everyone makes</h2>
        <p>Word-for-word translation is the single most common error. French and English résumés follow different conventions. English CVs favor terse, achievement-driven bullet points and confident action verbs; translated directly into French, that same phrasing can come across as overly self-promotional or simply awkward. French CVs often include a brief professional summary near the top, and the tone tends to be a notch more formal throughout.</p>
        <p>The other common mistake: listing "French" or "bilingual" as a skill line with no context. Quebec employers usually want specifics — are you comfortable presenting to clients in French? Writing formal business correspondence? Leading a meeting? A vague skill tag doesn't answer that.</p>
        <h2>What Quebec employers are actually screening for</h2>
        <p>In practice, the quality of your written French in the application itself is often the first real test — before anyone reads your qualifications, the writing quality signals whether your French is functional or genuinely fluent. If you trained or worked outside Quebec, it's also worth briefly noting any local certification equivalencies where relevant, since that's a common point of confusion for employers reviewing out-of-province credentials.</p>
        <p>Getting this right matters more here than almost anywhere else in Canada — and it's exactly the kind of detail that's easy to get wrong when a résumé is translated rather than written natively in each language from the start.</p>
      `
    },
    fr: {
      title: "Comment adapter votre CV au marché bilingue de l'emploi au Québec",
      metaDescription: "Conseils pratiques pour adapter votre CV au marché bilingue du Québec — choix de la langue, erreurs courantes, et ce que les employeurs recherchent vraiment.",
      date: "30 août 2026",
      content: `
        <p>Le marché de l'emploi au Québec fonctionne différemment du reste du Canada. Le français n'est pas seulement courant ici — c'est la langue de travail principale pour la plupart des postes, et elle est protégée par une loi provinciale. Si vous cherchez un emploi au Québec, votre CV doit refléter cette réalité, pas seulement mentionner le français comme une simple compétence cochée.</p>
        <h2>Votre CV devrait-il être en français ou en anglais?</h2>
        <p>Pour la plupart des postes basés au Québec, en dehors des secteurs purement anglophones — certaines start-ups technologiques, certaines multinationales — un CV en français est l'attente par défaut, même si le poste implique un peu d'anglais. Si vous êtes vraiment bilingue, la position la plus solide est d'avoir les deux versions prêtes, chacune rédigée nativement dans cette langue plutôt que traduite mot à mot de l'autre. Un recruteur peut habituellement faire la différence, et cela compte plus qu'on ne le pense.</p>
        <h2>L'erreur que presque tout le monde commet</h2>

        <p>Most interview advice is generic enough to apply to any job, which makes it not very useful for the one you're actually interviewing for. Here's advice that's specific enough to actually change how you prepare.</p>
        <h2>1. Prepare stories, not bullet points</h2>
        <p>Reciting your résumé out loud isn't preparation — the interviewer already has your résumé. What they don't have is the story behind each line: what the actual situation was, what you specifically did, and what happened as a result. Pick 4-5 real situations from your background that demonstrate different strengths, and be ready to walk through each one in detail, including the messy parts. A story with a real obstacle in it is more convincing than one that sounds too smooth.</p>
        <h2>2. Research the actual team, not just the company</h2>

function bindStaffLoginEvents(){
  const emailInput = document.getElementById('staff-login-email');
  const passwordInput = document.getElementById('staff-login-password');
  if(emailInput) emailInput.oninput = ()=>{ state.staffLoginForm.email = emailInput.value; };
  if(passwordInput) passwordInput.oninput = ()=>{ state.staffLoginForm.password = passwordInput.value; };
  const togglePasswordBtn = document.getElementById('staff-login-toggle-password');
  if(togglePasswordBtn) togglePasswordBtn.onclick = ()=>{ state.staffLoginForm.showPassword = !state.staffLoginForm.showPassword; render(); };
  const rememberCheckbox = document.getElementById('staff-login-remember');
  if(rememberCheckbox) rememberCheckbox.onchange = ()=>{ state.staffLoginForm.remember = rememberCheckbox.checked; };
  const forgotLink = document.getElementById('staff-login-forgot');
  if(forgotLink) forgotLink.onclick = submitStaffForgotPassword;
  const submitBtn = document.getElementById('staff-login-submit');
  if(submitBtn) submitBtn.onclick = submitStaffLogin;
  [emailInput, passwordInput].forEach(el=>{
    if(el) el.onkeydown = (e)=>{ if(e.key==='Enter') submitStaffLogin(); };
  });
  const backLink = document.getElementById('staff-login-back');
  if(backLink) backLink.onclick = ()=>{
    state.showStaffLogin = false;
    state.showLanding = true;
    history.pushState({}, '', '/');
    render();
  };
}

async function submitStaffLogin(){
  const f = state.staffLoginForm;
  f.error = "";
  if(!f.email || !f.password){
    f.error = "Enter your email and password.";
    render(); return;
  }
  f.busy = true;
  render();
  try{
    await window.firebaseSetAuthPersistence(f.remember);
    const cred = await window.firebaseSignIn(f.email, f.password);
    const profile = await window.firebaseGetProfile(cred.user.uid);
    const role = profile && profile.role;
    if(role !== 'staff' && role !== 'admin'){
      await window.firebaseSignOutUser();
      f.error = "This account doesn't have staff access.";
      f.busy = false;
      render();
      return;
    }
    // Valid staff account — the existing sign-in listener (in loadAll()) picks
    // up this session, sets state.currentUser, and loads the full profile on
    // its own; this just makes sure they land on the Staff tab once that
    // completes, and leaves the dedicated staff-login URL behind.
    state.showStaffLogin = false;
    state.tab = 'staff';
    history.pushState({}, '', '/');
    f.busy = false;
    f.email = ""; f.password = "";
  }catch(e){
    f.error = firebaseAuthErrorMessage(e);
    f.busy = false;
    render();
  }
}

async function submitStaffForgotPassword(){
  const f = state.staffLoginForm;
  f.forgotMessage = ""; f.error = "";
  if(!f.email){
    f.error = "Enter your email above first, then click 'Forgot password?'";
    render(); return;
  }
  f.forgotBusy = true;
  render();
  try{
    await window.firebaseSendPasswordReset(f.email);
    // Deliberately the same message whether or not the account exists —
    // confirming/denying an email's existence to an unauthenticated visitor
    // is an account-enumeration risk on a login page.
    f.forgotMessage = "If that email has a staff account, a reset link is on its way.";
  }catch(e){
    f.forgotMessage = "If that email has a staff account, a reset link is on its way.";
  }
  f.forgotBusy = false;
  render();
}

// Reads a backup exported from the old localStorage-based version of the app and writes
// everything it finds into the CURRENTLY signed-in Firebase account, using the exact same
// key-to-location mapping used throughout the Firestore migration. Old keys were of the form
// "prefix:oldUsername" (e.g. "profile:jean@example.com") — the old username is detected
// automatically from whichever key is present, since the person is no longer signed in under
// that identity (Firebase issues a completely different uid).
async function handleImportOldDataFile(e){
  const file = e.target.files[0];
  if(!file) return;
  state.ui.importOldDataFileName = file.name;
  state.ui.importOldDataError = "";
  state.ui.importOldDataResults = null;
  state.ui.importOldDataLoading = true;
  render();

  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const results = await importOldDataIntoFirestore(data, state.currentUser.username);
    state.ui.importOldDataResults = results;
    if(results.imported.length) await loadUserData(); // refresh in-memory state from Firestore
  }catch(e){
    state.ui.importOldDataError = t('errCouldntReadBackupFile');
  }
  state.ui.importOldDataLoading = false;
  render();
}

async function importOldDataIntoFirestore(data, uid){
  const results = { imported: [], errors: [] };

  const oldUsernameKey = Object.keys(data).find(k => k.startsWith('profile:'))
    || Object.keys(data).find(k => k.includes(':'));
  const oldUsername = oldUsernameKey ? oldUsernameKey.split(':').slice(1).join(':') : null;
  if(!oldUsername){
    results.errors.push('Could not find any recognizable Parcourai data in this file.');
    return results;
  }
  const raw = (prefix) => data[prefix + ':' + oldUsername];

  // Profile (single document)
  try{
    const v = raw('profile');
    if(v){ await window.firebaseSaveProfile(uid, JSON.parse(v)); results.imported.push('Profile'); }
  }catch(e){ results.errors.push('Profile'); }

  // Applications and analyses (subcollections with their own bridge functions)
  try{
    const v = raw('applications');
    if(v){ const items = JSON.parse(v); await window.firebaseSaveApplications(uid, items); results.imported.push(items.length+' application(s)'); }
  }catch(e){ results.errors.push('Applications'); }
  try{
    const v = raw('analyses');
    if(v){ const items = JSON.parse(v); await window.firebaseSaveAnalyses(uid, items); results.imported.push(items.length+' saved analysis/analyses'); }
  }catch(e){ results.errors.push('Analyses'); }

  // Simple "meta" single-value blobs
  const metaMap = {
    goals: 'goals', suggestions: 'jobSuggestions', reflection: 'reflection',
    improvementplan: 'improvementPlan', socialmediaeval: 'socialMediaEval',
    careerpath: 'careerPath', speech: 'interviewSpeech', skillsassessment: 'skillsAssessment',
    jobstrategy: 'jobStrategy'
  };
  for(const oldKey in metaMap){
    try{
      const v = raw(oldKey);
      if(v){ await window.firebaseSaveMeta(uid, metaMap[oldKey], JSON.parse(v)); results.imported.push(metaMap[oldKey]); }
    }catch(e){ results.errors.push(metaMap[oldKey]); }
  }
  // uiLang is a plain string, not JSON — handled separately
  try{
    const v = raw('uilang');
    if(v === 'en' || v === 'fr'){ await window.firebaseSaveMeta(uid, 'uiLang', v); results.imported.push('Language preference'); }
  }catch(e){}

  // List-based subcollections
  const subMap = { jobaccounts: 'jobAccounts', chatfolders: 'chatFolders', chatconversations: 'chatConversations', improvementgoals: 'improvementGoals' };
  for(const oldKey in subMap){
    try{
      const v = raw(oldKey);
      if(v){ const items = JSON.parse(v); await window.firebaseSaveSubcollection(uid, subMap[oldKey], items); results.imported.push(items.length+' '+subMap[oldKey]); }
    }catch(e){ results.errors.push(subMap[oldKey]); }
  }

  // Document libraries: metadata index + actual file bytes, matched up by id
  try{
    const v = raw('selfdiscoverydocs');
    if(v){
      const docs = JSON.parse(v);
      for(const d of docs){
        const fileDataUrl = data['selfdiscoverydocfile:'+d.id];
        if(fileDataUrl){ try{ await window.firebaseUploadFile(uid, 'selfDiscoveryDocs/'+d.id, fileDataUrl); }catch(e){} }
      }
      await window.firebaseSaveSubcollection(uid, 'selfDiscoveryDocs', docs);
      results.imported.push(docs.length+' bilan de compétences file(s)');
    }
  }catch(e){ results.errors.push('Bilan de compétences documents'); }

  try{
    const v = raw('personalfilesvault');
    if(v){
      const files = JSON.parse(v);
      for(const f of files){
        const fileDataUrl = data['personalfilesvaultfile:'+f.id];
        if(fileDataUrl){ try{ await window.firebaseUploadFile(uid, 'personalFilesVault/'+f.id, fileDataUrl); }catch(e){} }
      }
      await window.firebaseSaveSubcollection(uid, 'personalFilesVault', files);
      results.imported.push(files.length+' personal vault file(s)');
    }
  }catch(e){ results.errors.push('Personal document vault'); }

  return results;
}

async function submitChangePassword(){
  const c = state.changePassword;
  c.error = ""; c.success = "";
  if(!c.current){ c.error = t('errEnterCurrentPassword'); render(); return; }
  if(!isValidPassword(c.new1)){ c.error = t('errNewPasswordRules') + " " + passwordRulesText() + "."; render(); return; }
  if(c.new1 !== c.new2){ c.error = t('errPasswordsDontMatch'); render(); return; }
  c.busy = true; render();
  try{
    await window.firebaseChangePassword(c.current, c.new1);
    c.busy = false;
    state.changePassword = { current:"", new1:"", new2:"", error:"", busy:false, success: t('toastPasswordUpdated') };
    render();
  }catch(e){
    c.error = firebaseAuthErrorMessage(e);
    c.busy = false;
    render();
  }
}

async function submitUpdateEmail(){
  const em = state.updateEmail;
  em.error = ""; em.success = "";
  if(!isValidEmail(normUsername(em.newEmail))){ em.error = t('errEnterValidEmail'); render(); return; }
  if(!em.currentPassword){ em.error = t('errEnterCurrentPassword'); render(); return; }
  em.busy = true; render();
  try{
    await window.firebaseUpdateEmail(em.currentPassword, normUsername(em.newEmail));
    em.busy = false;
    state.updateEmail = { newEmail:"", currentPassword:"", error:"", busy:false, success: t('toastVerificationEmailSent') };
    render();
  }catch(e){
    em.error = firebaseAuthErrorMessage(e);
    em.busy = false;
    render();
  }
}

function bindLoginEvents(){
  document.querySelectorAll('[data-ui-lang]').forEach(b=>{
    b.onclick = ()=>{ state.uiLang = b.dataset.uiLang; render(); };
  });
  const backToLanding = document.getElementById('back-to-landing');
  if(backToLanding) backToLanding.onclick = ()=>{ state.showLanding = true; render(); };
  const u = document.getElementById('auth-username');
  const p = document.getElementById('auth-pin');
  const p2 = document.getElementById('auth-pin2');
  if(u) u.oninput = ()=>{ state.auth.username = u.value; };
  if(p) p.oninput = ()=>{ state.auth.pin = p.value; };
  if(p2) p2.oninput = ()=>{ state.auth.pin2 = p2.value; };

  let submitFn = submitSignIn;
  if(state.auth.mode === 'create') submitFn = submitCreateAccount;
  if(state.auth.mode === 'reset') submitFn = submitPasswordReset;
  const submit = document.getElementById('auth-submit');
  if(submit) submit.onclick = submitFn;
  [u,p,p2].forEach(el=>{ if(el) el.onkeydown = (e)=>{ if(e.key==='Enter') submitFn(); }; });

  const goCreate = document.getElementById('go-create'); if(goCreate) goCreate.onclick = ()=>setAuthMode('create');
  const goReset = document.getElementById('go-reset'); if(goReset) goReset.onclick = ()=>setAuthMode('reset');
  const goSignin = document.getElementById('go-signin'); if(goSignin) goSignin.onclick = ()=>setAuthMode('signin');
}

      <div class="card">
        <h2>${esc(pl.language)}</h2>
        <div style="font-size:13.5px;line-height:1.6;">${esc(pl.level_summary || pl.levelSummary || '')}</div>

            ${pl.vocabulary.map(v=>`
              <div style="padding:6px 0;border-bottom:1px solid var(--line);">
                <span style="font-weight:600;font-size:13.5px;">${esc(v.word)}</span>
                <span style="font-size:13px;color:var(--muted);"> — ${esc(v.translation)}</span>
                ${v.example ? `<div style="font-size:12.5px;font-style:italic;color:var(--muted);margin-top:2px;">${esc(v.example)}</div>` : ''}
              </div>

          </ul>

        <div style="font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--primary);margin-bottom:8px;">${esc(t('hFreeResources'))}</div>

            <div style="font-size:12.5px;color:var(--muted);margin-top:4px;">${esc(r.description)}</div>
          </div>
        `).join('')}
      </div>

      ${pl.quiz && pl.quiz.questions && pl.quiz.questions.length ? `
        <div class="card">
          <h2>${esc(t('hLevelTest'))} — ${esc(pl.language)}</h2>
          ${pl.quiz.submitted ? `
            <div style="text-align:center;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:10px;">
              <div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:0.5px;">${esc(t('estimatedLevel'))}</div>
              <div style="font-size:32px;font-weight:700;color:var(--primary);margin:6px 0;">${esc(pl.quiz.level)}</div>
              <div style="font-size:13.5px;color:var(--muted);">${pl.quiz.score}% — ${esc(t('scoreLabel'))}</div>
              <button class="btn btn-ghost btn-sm" data-retake-quiz="${pi}" style="margin-top:12px;">${esc(t('retakeQuizBtn'))}</button>
            </div>
          ` : ''}
          ${pl.quiz.questions.map((q,qi)=>{
            const userAns = pl.quiz.userAnswers[qi];
            const correctIdx = q.correct_index ?? q.correctIndex;
            return `
            <div style="padding:10px 0;border-top:1px solid var(--line);">
              <div style="font-size:13.5px;font-weight:600;margin-bottom:6px;">${qi+1}. ${esc(q.question)}</div>
              ${(q.options||[]).map((opt,oi)=>{
                if(pl.quiz.submitted){
                  const color = oi===correctIdx ? 'var(--success)' : (oi===userAns ? 'var(--danger)' : 'var(--ink)');
                  const marker = oi===correctIdx ? '✓ ' : (oi===userAns ? '✕ ' : '');
                  return `<div style="font-size:13px;padding:4px 0 4px 12px;color:${color};">${marker}${esc(opt)}</div>`;
                }
                return `
                  <label style="display:block;font-size:13px;padding:4px 0;cursor:pointer;">
                    <input type="radio" name="quiz-${pi}-${qi}" data-quiz-answer="${pi}:${qi}:${oi}" ${userAns===oi?'checked':''}> ${esc(opt)}
                  </label>
                `;
              }).join('')}
              ${pl.quiz.submitted && q.explanation ? `<div style="font-size:12.5px;color:var(--muted);margin-top:4px;font-style:italic;">${esc(q.explanation)}</div>` : ''}
            </div>
          `;}).join('')}
          ${!pl.quiz.submitted ? `
            <button class="btn btn-primary btn-sm" data-submit-quiz="${pi}" style="margin-top:12px;" ${pl.quiz.userAnswers.some(a=>a===null)?'disabled':''}>${esc(t('submitQuizBtn'))}</button>
            ${pl.quiz.userAnswers.some(a=>a===null) ? `<div class="hint" style="margin-top:6px;margin-bottom:0;">${esc(t('answerAllQuestions'))}</div>` : ''}
          ` : ''}
        </div>
      ` : ''}
    `).join('')}

    ${(la.overallTips||[]).length ? `
      <div class="card">
        <h2>${esc(t('hOverallLanguageTips'))}</h2>
        <ul style="margin:0 0 0 18px;padding:0;font-size:13.5px;line-height:1.6;">
          ${la.overallTips.map(tip=>`<li>${esc(tip)}</li>`).join('')}
        </ul>
      </div>
    ` : ''}

    ${pageAssistantCardHtml('languages')}
  `;
}

// ---------- Resume / cover letter formatting ----------
function parseResumeText(text){
  const lines = (text||'').split(/\r?\n/);
  let i = 0;
  while(i<lines.length && !lines[i].trim()) i++;
  const name = lines[i] ? lines[i].trim() : '';
  i++;
  while(i<lines.length && !lines[i].trim()) i++;
  const contact = (lines[i] && !isHeaderLine(lines[i].trim())) ? lines[i].trim() : '';
  if(contact) i++;

  const sections = [];
  let current = null;
  for(; i<lines.length; i++){
    const t = lines[i].trim();
    if(!t) continue;
    if(isHeaderLine(t)){
      current = { header: t, raw: [] };
      sections.push(current);
      continue;
    }
    if(!current){ current = { header:'', raw:[] }; sections.push(current); }
    current.raw.push(t);
  }

  const parsedSections = sections.map(sec=>{
    const h = sec.header.toUpperCase();
    if(h.includes('EXPERIENCE') || h.includes('EMPLOI') || h.includes('EXPÉRIENCE')){
      const entries = [];
      let ent = null;
      sec.raw.forEach(l=>{
        if(/^[•\-\*]\s?/.test(l)){
          if(!ent){ ent = {header:'', bullets:[]}; entries.push(ent); }
          ent.bullets.push(l.replace(/^[•\-\*]\s?/,''));
        } else {
          ent = {header:l, bullets:[]};
          entries.push(ent);
        }
      });
      return {type:'experience', header:sec.header, entries};
    }
    if(h.includes('EDUCATION') || h.includes('FORMATION') || h.includes('DIPLÔME')){
      return {type:'education', header:sec.header, entries: sec.raw};
    }
    if(h.includes('SKILL') || h.includes('CERTIF') || h.includes('LANGUAGE') || h.includes('COMPÉTENCE') || h.includes('LANGUE')){
      const items = sec.raw.join(', ').split(',').map(s=>s.trim()).filter(Boolean);
      return {type:'list', header:sec.header, items};
    }
    return {type:'paragraph', header:sec.header, text: sec.raw.join(' ')};
  });

  return { name, contact, sections: parsedSections };
}

function isHeaderLine(t){
  if(!t) return false;
  if(t.length > 42) return false;
  if(t.includes('|')) return false; // "MBA | HEC | 2019" is an entry line, not a header, even if all-caps
  if(/[a-zàâçéèêëîïôûùüÿñæœ]/.test(t)) return false; // any lowercase (incl. accented) disqualifies
  if(!/[A-ZÀÂÇÉÈÊËÎÏÔÛÙÜŸÑÆŒ]/.test(t)) return false;
  // Being short and all-caps isn't enough on its own — real content is often short and all-caps
  // too (skills like "SQL"/"AWS"/"API", degree names like "MBA"). Require it to actually contain
  // one of the header words our templates use, in either language.
  const HEADER_KEYWORDS = ['SUMMARY','RÉSUMÉ','RESUME','PROFIL','EXPERIENCE','EXPÉRIENCE','EMPLOI','EDUCATION','FORMATION','DIPLÔME','SKILL','COMPÉTENCE','CERTIF','LANGUAGE','LANGUE'];
  return HEADER_KEYWORDS.some(k => t.includes(k));
}

function parseCoverLetterParagraphs(text){
  return (text||'').split(/\n\s*\n/).map(p=>p.replace(/\n/g,' ').trim()).filter(Boolean);
}

function twoColRow(leftHtml, rightHtml){
  return `<table style="width:100%;border-collapse:collapse;margin:0;"><tr>
    <td style="padding:0;text-align:left;vertical-align:top;">${leftHtml}</td>
    <td style="padding:0;text-align:right;vertical-align:top;white-space:nowrap;">${rightHtml}</td>
  </tr></table>`;
}

function resumeFragmentHtml(parsed, opts){
  const o = Object.assign({
    displayFont: "'Fraunces', Georgia, serif",
    bodyFont: "'IBM Plex Sans', Calibri, Arial, sans-serif",
    accent: '#C08A2E', ink:'#161B22', muted:'#5B6570', primary:'#1F3A5F',
    nameSize:'21pt', bodySize:'10.5pt'
  }, opts||{});
  const contactParts = (parsed.contact||'').split('|').map(s=>s.trim()).filter(Boolean);

  let html = `<div style="font-family:${o.bodyFont};color:${o.ink};font-size:${o.bodySize};line-height:1.4;">`;
  html += `<div style="text-align:center;margin-bottom:9pt;">`;
  html += `<div style="font-family:${o.displayFont};font-size:${o.nameSize};font-weight:700;color:${o.primary};letter-spacing:0.3pt;">${esc(parsed.name||'')}</div>`;
  if(contactParts.length) html += `<div style="font-size:9pt;color:${o.muted};margin-top:3pt;">${contactParts.map(esc).join(' &nbsp;·&nbsp; ')}</div>`;
  html += `<div style="height:1.5pt;background:${o.accent};width:56pt;margin:7pt auto 0 auto;"></div>`;
  html += `</div>`;

  parsed.sections.forEach(sec=>{
    if(sec.type==='paragraph' && !sec.text && !sec.header) return;
    html += `<div style="margin-top:10pt;">`;
    if(sec.header){
      html += `<div style="font-size:9pt;font-weight:700;letter-spacing:1.3pt;color:${o.primary};text-transform:uppercase;border-bottom:1pt solid ${o.accent};padding-bottom:2pt;margin-bottom:5pt;">${esc(sec.header)}</div>`;
    }
    if(sec.type==='paragraph'){
      html += `<div style="font-size:${o.bodySize};">${esc(sec.text)}</div>`;
    } else if(sec.type==='experience'){
      sec.entries.forEach(ent=>{
        const parts = ent.header.split('|').map(s=>s.trim());
        const [t,c,d] = [parts[0]||'', parts[1]||'', parts[2]||''];
        html += `<div style="margin-bottom:7pt;">`;
        html += twoColRow(
          `<span style="font-weight:600;font-size:10.5pt;">${esc(t)}${c?' — '+esc(c):''}</span>`,
          `<span style="color:${o.muted};font-weight:500;font-size:9.5pt;">${esc(d)}</span>`
        );
        if(ent.bullets.length){
          html += `<ul style="margin:3pt 0 0 14pt;padding:0;">`;
          ent.bullets.forEach(b=> html += `<li style="margin-bottom:2pt;font-size:10pt;">${esc(b)}</li>`);
          html += `</ul>`;
        }
        html += `</div>`;
      });
    } else if(sec.type==='education'){
      sec.entries.forEach(l=>{
        const parts = l.split('|').map(s=>s.trim());
        const [deg,sch,yr] = [parts[0]||'', parts[1]||'', parts[2]||''];
        html += `<div style="margin-bottom:4pt;">` + twoColRow(
          `<span style="font-size:10pt;"><strong>${esc(deg)}</strong>${sch?', '+esc(sch):''}</span>`,
          `<span style="color:${o.muted};font-size:9.5pt;">${esc(yr)}</span>`
        ) + `</div>`;
      });
    } else if(sec.type==='list'){
      html += `<div style="font-size:10pt;">${sec.items.map(esc).join(' &nbsp;·&nbsp; ')}</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

// French business letters conventionally include an "Objet :" line stating
// the letter's purpose, positioned after the recipient block and before the
// salutation; English cover letters use the equivalent "Re:" line less
// universally but it's still a common, professional touch. Built
// programmatically from the job title already on the analysis rather than
// asking the AI to generate it, since it's fully determined by data already
// on hand and this avoids any risk of inconsistent phrasing.
// Real, verified search-URL patterns for major job platforms — confirmed directly
// against each site's actual query parameters (not guessed), so these links reliably
// land on a pre-filled results page rather than a broken/generic search screen.
// True one-click "auto-apply" isn't possible here: none of these platforms offer a
// public API for third-party apps to submit applications on a user's behalf, and
// automating their sites would violate their Terms of Service — so this gets the
// candidate to a pre-filled results page as fast as possible, with their tailored
// documents ready to copy, rather than pretending to submit anything automatically.
function jobPlatformSearchUrls(query, location){
  const q = encodeURIComponent(query || '');
  const loc = encodeURIComponent(location || '');
  const isFrench = state.uiLang === 'fr';
  return [
    { name: 'LinkedIn', url: `https://www.linkedin.com/jobs/search/?keywords=${q}&location=${loc}` },
    { name: 'Indeed', url: `https://www.indeed.com/jobs?q=${q}&l=${loc}` },
    { name: 'Glassdoor', url: `https://www.glassdoor.com/Job/jobs.htm?sc.keyword=${q}&locT=C&locKeyword=${loc}` },
    { name: 'Jobillico', url: `https://www.jobillico.com/${isFrench?'recherche-emploi':'search-jobs'}?skwd=${q}&scty=${loc}` },
    { name: isFrench ? 'Guichet-Emplois' : 'Job Bank', url: `https://www.guichetemplois.gc.ca/jobsearch/jobsearch?searchstring=${q}&locationstring=${loc}` }
  ];
}

function platformLinksHtml(query, location){
  return jobPlatformSearchUrls(query, location).map(p=>`
    <a href="${esc(p.url)}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">${esc(p.name)} ↗</a>
  `).join('');
}

// When an interview date/time is set on a job that's still at an earlier stage
// (saved/tailored/applied), advancing the stage to "interviewing" automatically
// saves a manual step — scheduling an interview already tells us where things
// stand. Never downgrades an existing 'interviewing'/'offer'/'rejected' stage,
// and never advances anything just because the field was cleared.
function stageAfterInterviewDateSet(currentStage){
  const earlyStages = ['saved', 'tailored', 'applied', undefined, ''];
  return earlyStages.includes(currentStage) ? 'interviewing' : currentStage;
}

function computeWageBreakdown(salary){
  if(!salary || !salary.stated || (salary.min==null && salary.max==null)) return null;
  const calcFor = (amount, hours)=>{
    if(amount==null) return null;
    let hourly, weekly, monthly, yearly;
    switch(salary.type){
      case 'hourly': hourly = amount; weekly = amount*hours; yearly = weekly*52; monthly = yearly/12; break;
      case 'weekly': weekly = amount; hourly = amount/hours; yearly = weekly*52; monthly = yearly/12; break;
      case 'monthly': monthly = amount; yearly = amount*12; weekly = yearly/52; hourly = weekly/hours; break;
      case 'annual': yearly = amount; monthly = amount/12; weekly = amount/52; hourly = weekly/hours; break;
      default: return null;
    }
    return { hourly, weekly, monthly, yearly };
  };
  const build = (hours)=> ({ min: calcFor(salary.min, hours), max: calcFor(salary.max, hours) });
  return { h35: build(35), h40: build(40) };
}

// Kept for backward compatibility with callers that only need the hourly figure.
function computeHourlyWages(salary){
  const b = computeWageBreakdown(salary);
  if(!b) return null;
  return {
    h35: { min: b.h35.min ? b.h35.min.hourly : null, max: b.h35.max ? b.h35.max.hourly : null },
    h40: { min: b.h40.min ? b.h40.min.hourly : null, max: b.h40.max ? b.h40.max.hourly : null }
  };
}

// Simple direct calculator for Job Strategy's editable salary tool: hourly rate + hours/week
// in, weekly/monthly/annual out. Returns null on invalid input rather than NaN/Infinity, so
// the UI can cleanly show nothing instead of garbage figures.
function calculateSalaryFromHourly(hourlyRate, hoursPerWeek){
  const rate = parseFloat(hourlyRate);
  const hours = parseFloat(hoursPerWeek);
  if(!isFinite(rate) || !isFinite(hours) || rate <= 0 || hours <= 0) return null;
  const weekly = rate * hours;
  const yearly = weekly * 52;
  const monthly = yearly / 12;
  return { hourly: rate, weekly, monthly, yearly };
}

function calculateSalaryFromAnnual(annualSalary, hoursPerWeek){
  const yearly = parseFloat(annualSalary);
  const hours = parseFloat(hoursPerWeek);
  if(!isFinite(yearly) || !isFinite(hours) || yearly <= 0 || hours <= 0) return null;
  const weekly = yearly / 52;
  const monthly = yearly / 12;
  const hourly = weekly / hours;
  return { hourly, weekly, monthly, yearly };
}

function formatMoneyRound(n, currency){
  if(n==null) return '';
  const symbol = {USD:'$',CAD:'$',EUR:'€',GBP:'£'}[currency] || (currency ? currency+' ' : '');
  return symbol + Math.round(n).toLocaleString();
}

function formatRangeCell(minVal, maxVal, currency, roundWhole){
  const fmt = roundWhole ? formatMoneyRound : formatMoney;
  if(minVal==null && maxVal==null) return '—';
  if(minVal!=null && maxVal!=null && Math.round(minVal)!==Math.round(maxVal)) return fmt(minVal,currency)+' – '+fmt(maxVal,currency);
  return fmt(minVal ?? maxVal, currency);
}

function formatMoney(n, currency){
  if(n==null) return '';
  const symbol = {USD:'$',CAD:'$',EUR:'€',GBP:'£'}[currency] || (currency ? currency+' ' : '');
  return symbol + n.toFixed(2).replace(/\.00$/,'');
}

  const groups = allGroups
    .filter(g=>g.items.length>0)

  const tabsHtml = `
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;">

        const count = allGroups.find(g=>g.stage===stage).items.length;
        if(count===0) return '';
        return `<button class="btn btn-sm ${activeTab===stage?'btn-primary':'btn-ghost'}" data-app-status-tab="${stage}">${esc(stageLabel(stage))} (${count})</button>`;
      }).join('')}
    </div>
  `;

  return tabsHtml + groups.map(g=>{
    const c = STAGE_COLORS[g.stage] || STAGE_COLORS.saved;
    return `
      <div style="display:flex;align-items:center;gap:8px;margin:22px 0 10px 0;">
        <div style="width:8px;height:8px;border-radius:50%;background:${c.fg};flex-shrink:0;"></div>
        <div style="font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:${c.fg};">${stageLabel(g.stage)}</div>
        <div style="font-size:11px;color:var(--muted);">(${g.items.length})</div>
        <div style="flex:1;height:1px;background:var(--line);"></div>
      </div>
      ${g.items.map(a=>appCard(a)).join('')}
    `;
  }).join('');
}

function goalsCardHtml(apps){
  const goal = state.goals.dailyGoal;
  const counts = computeDailyCounts(apps);
  const todayKey = dateKeyLocal(Date.now());
  const todayCount = counts[todayKey] || 0;
  const days = getLast7Days();
  const editing = state.ui.editingGoal || !goal;

  const goalSetterHtml = `
    <div class="row" style="align-items:flex-end;">
      <div><label>${esc(t('labelAppsPerDay'))}</label><input type="text" id="goal-input" value="${esc(state.ui.goalInput || (goal||''))}" placeholder="e.g. 5" inputmode="numeric" style="max-width:120px;"></div>
      <div><button class="btn btn-primary btn-sm" id="save-goal-btn">${esc(t('setGoal'))}</button></div>
    </div>
  `;

  if(!goal || editing){
    return `
      <div class="card">
        <h2>${esc(t('hDailyGoal'))}</h2>
        <div class="hint">${esc(t('hintDailyGoal'))}</div>
        ${goalSetterHtml}
      </div>
    `;
  }

  const metToday = todayCount >= goal;
  const pct = Math.min(100, Math.round((todayCount/goal)*100));

  return `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <h2>${esc(t('hDailyGoal'))}</h2>
        <button class="btn btn-ghost btn-sm" id="edit-goal-btn">${esc(t('editGoal'))}</button>
      </div>
      <div style="display:flex;align-items:center;gap:16px;margin-top:8px;">
        <div style="width:64px;height:64px;border-radius:50%;background:${metToday?'var(--success-soft)':'var(--accent-soft)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <span style="font-family:var(--font-display);font-weight:700;font-size:15px;color:${metToday?'var(--success)':'#7A5A16'};">${todayCount}/${goal}</span>
        </div>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:13.5px;color:${metToday?'var(--success)':'var(--ink)'};">
            ${metToday ? t('goalReached') : `${goal-todayCount} ${t('goalMoreToHit')}`}
          </div>
          <div style="height:6px;background:var(--paper);border-radius:4px;margin-top:6px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:${metToday?'var(--success)':'var(--accent)'};border-radius:4px;"></div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-top:16px;">
        ${days.map(d=>{
          const c = counts[d.key] || 0;
          const met = c >= goal;
          return `<div style="flex:1;text-align:center;">
            <div style="font-family:var(--font-mono);font-size:9.5px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;">${esc(d.label)}</div>
            <div style="height:36px;border-radius:5px;background:${d.isToday?'var(--paper)':'#F5F6F3'};border:${d.isToday?'1px dashed var(--accent)':'1px solid var(--line)'};display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;">
              <span style="font-size:11px;font-weight:700;color:${c===0?'var(--muted)':met?'var(--success)':'var(--accent)'};">${c}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function appCard(a){
  const rejected = a.stage === 'rejected';

  return `
    <div class="app-card">
      <div class="app-card-top">
        <div>
          <div class="app-role">${esc(a.title)} ${scoreBadgeHtml(a.compatibilityScore)} ${classificationBadgeHtml(a.jobClassification)}</div>
          <div class="app-company">${esc(a.company)}</div>

        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <select class="status-select" data-status="${a.id}">
            ${STAGES.map(s=>`<option value="${s}" ${a.stage===s?'selected':''}>${stageLabel(s)}</option>`).join('')}
            <option value="rejected" ${a.stage==='rejected'?'selected':''}>${stageLabel('rejected')}</option>
          </select>
          <button class="icon-btn" data-remove-app="${a.id}">✕</button>
        </div>

          }
          if(rejected && i===STAGES.length-1) cls='';
          return `<div class="pipeline-stage ${cls}"><div class="pipeline-track"></div><div class="dot"></div><div class="pipeline-label">${stageLabel(s)}</div></div>`;
        }).join('')}
        ${rejected ? `<div class="pipeline-stage rejected"><div class="pipeline-track"></div><div class="dot"></div><div class="pipeline-label">${stageLabel('rejected')}</div></div>` : ''}

      <div class="divider"></div>

function signupChartHtml(signupsByDay){
  const days = [];
  for(let i = 29; i >= 0; i--){
    const d = new Date(Date.now() - i*24*60*60*1000);
    const key = d.toISOString().slice(0,10);
    days.push({ key, count: signupsByDay[key] || 0 });
  }
  const max = Math.max(1, ...days.map(d=>d.count));
  return `
    <div style="display:flex;align-items:flex-end;gap:2px;height:120px;margin-top:14px;">
      ${days.map(d=>`
        <div style="flex:1;background:${d.count>0?'var(--primary)':'var(--line)'};border-radius:2px 2px 0 0;height:${Math.max(3, (d.count/max)*100)}%;" title="${d.key}: ${d.count} signup${d.count===1?'':'s'}"></div>
      `).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px;font-family:var(--font-mono);">
      <span>${days[0].key}</span>
      <span>${days[days.length-1].key}</span>
    </div>
  `;
}

async function exportUsersCsv(){
  state.ui.exportUsersLoading = true; state.ui.exportUsersError = "";
  render();
  try{
    const idToken = await window.firebaseGetIdToken();
    if(!idToken) throw new Error('Not signed in.');
    const resp = await fetch('/api/staff-export-users', {
      headers: { 'Authorization': 'Bearer ' + idToken }
    });
    if(!resp.ok){
      const data = await resp.json().catch(()=>({}));
      throw new Error(data.error || 'Something went wrong.');
    }
    // Trigger a real file download from the CSV response, since a Bearer
    // token can't just be put in a plain <a href> link.
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `parcourai-users-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    state.ui.exportUsersError = e.message;
  }
  state.ui.exportUsersLoading = false;
  render();
}

// ---------- Live job search (Adzuna / Jooble / JSearch via /api/jobs-search) ----------
// LinkedIn and Indeed don't offer public job-search APIs, so listings come from legitimate
// aggregator APIs whose keys live server-side. Results are session-only (not persisted).
async function loadJobSearchStatus(){
  if(state.ui.jobSearchProviders !== null) return;
  state.ui.jobSearchProviders = {};   // mark as requested so we don't re-fetch on every render
  try{
    const idToken = await window.firebaseGetIdToken();
    if(!idToken) return;
    const resp = await fetch('/api/jobs-search?status=1', { headers: { 'Authorization': 'Bearer ' + idToken } });
    const data = await resp.json();
    if(resp.ok && data.providers) state.ui.jobSearchProviders = data.providers;
  }catch(e){ /* status is cosmetic — the search itself reports real errors */ }
  if(state.tab==='accounts') render();
}

async function runJobSearch(page){
  const u = state.ui;
  const q = (document.getElementById('jobsearch-query')||{}).value || '';
  const location = (document.getElementById('jobsearch-location')||{}).value || '';
  const countryEl = document.getElementById('jobsearch-country');
  const remoteEl = document.getElementById('jobsearch-remote');
  u.jobSearchQuery = q; u.jobSearchLocation = location;
  if(countryEl) u.jobSearchCountry = countryEl.value;
  if(remoteEl) u.jobSearchRemote = remoteEl.value;
  if(!q.trim()){ u.jobSearchError = t('errJobSearchNeedsQuery'); render(); return; }
  u.jobSearchLoading = true; u.jobSearchError = ''; u.jobSearchPage = page || 1;
  render();
  try{
    const idToken = await window.firebaseGetIdToken();
    if(!idToken) throw new Error(t('errNotSignedIn'));
    const params = new URLSearchParams({ q: q.trim(), location: location.trim(), country: u.jobSearchCountry || 'ca', page: String(u.jobSearchPage) });
    if(u.jobSearchRemote === 'only') params.set('remote', 'only');
    const resp = await fetch('/api/jobs-search?' + params.toString(), { headers: { 'Authorization': 'Bearer ' + idToken } });
    const data = await resp.json();
    if(data && data.providers) u.jobSearchProviders = data.providers;
    if(!resp.ok) throw new Error(data.error || ('API error ' + resp.status));
    u.jobSearchResults = data.results || [];
    u.jobSearchProviderErrors = data.providerErrors || {};
    u.jobSearchSearched = data.searched || [];
  }catch(e){
    u.jobSearchError = e.message || t('errJobSearchFailed');
    u.jobSearchResults = null;
  }
  u.jobSearchLoading = false;
  render();
}

// Opens the Job Analyzer with a found listing already filled in, ready for tailoring a CV/cover letter.
function sendJobToAnalyzer(index){
  const job = (state.ui.jobSearchResults || [])[index];
  if(!job) return;
  const a = blankAnalysis();
  a.title = job.title || '';
  a.company = job.company || '';
  a.url = job.url || '';
  a.desc = job.description || '';
  state.currentAnalysis = a;
  state.ui.genError = '';
  state.ui.analyzerViewTab = 'analyses';
  state.tab = 'analyzer';
  render();
  toast(t('toastJobSentToAnalyzer'));
}

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Lightweight markdown renderer for the AI Assistant's chat replies — covers
// the small subset of markdown Claude actually uses in practice (bold,
// italics, bullet/numbered lists, paragraph breaks) rather than being a full
// parser. Always escapes HTML FIRST, so this can never introduce unescaped
// or unsafe markup even from AI-generated text.
function renderChatMarkdown(text){
  let html = esc(text);

  // Links are pulled out into placeholder tokens FIRST, before any other
  // formatting runs — otherwise the bold/italic/list regexes below could
  // match text inside an already-built <a href="..."> tag and corrupt it.
  // The real <a> tags are substituted back in at the very end.
  const links = [];
  const stashLink = (html_) => {
    const token = `\u0000LINK${links.length}\u0000`;
    links.push(html_);
    return token;
  };

  // Markdown-style links: [label](url)
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) =>
    stashLink(`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`)
  );
  // Bare URLs — trailing punctuation (. , ; : ! ? ) ] " ') is excluded from
  // the link itself so a URL at the end of a sentence doesn't swallow the
  // period or closing parenthesis.
  html = html.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]"'])/g, (url) =>
    stashLink(`<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`)
  );

  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');

  const lines = html.split('\n');
  const out = [];
  let listType = null; // 'ul' | 'ol' | null
  const closeList = () => { if(listType){ out.push(`</${listType}>`); listType = null; } };

  for(const line of lines){
    const bulletMatch = line.match(/^\s*[-•]\s+(.*)$/);
    const numberedMatch = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if(bulletMatch){
      if(listType !== 'ul'){ closeList(); out.push('<ul style="margin:4px 0 4px 18px;padding:0;">'); listType = 'ul'; }
      out.push(`<li>${bulletMatch[1]}</li>`);
    }else if(numberedMatch){
      if(listType !== 'ol'){ closeList(); out.push('<ol style="margin:4px 0 4px 18px;padding:0;">'); listType = 'ol'; }
      out.push(`<li>${numberedMatch[1]}</li>`);
    }else{
      closeList();
      out.push(line === '' ? '<div style="height:8px;"></div>' : `<div>${line}</div>`);
    }
  }
  closeList();
  let result = out.join('');

  // Substitute the real <a> tags back in now that all other formatting is done.
  links.forEach((linkHtml, i) => {
    result = result.replace(`\u0000LINK${i}\u0000`, linkHtml);
  });

  return result;
}

// Escapes text, then wraps any occurrences of the given key phrases in <strong> so they stand
// out when scanning a sample answer or talking points. Both the text and the phrases are run
// through esc() first so matching happens on already-safe HTML — this never introduces raw
// markup from the phrases themselves. Longer phrases are matched first so a short phrase that's
// a substring of a longer one doesn't fragment it.
function boldKeyPhrases(text, phrases){
  let escaped = esc(text);
  const sorted = (phrases||[]).filter(p=>p && p.trim()).map(p=>esc(p.trim())).sort((a,b)=>b.length-a.length);
  sorted.forEach(phrase=>{
    if(!phrase) return;
    const pattern = phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp('(' + pattern + ')(?![^<]*</strong>)', 'gi');
    escaped = escaped.replace(regex, '<strong>$1</strong>');
  });
  return escaped;
}

function sanitizeFilename(name){
  return (name || 'document').trim().replace(/[^\w\-]+/g, '_').replace(/_+/g,'_').replace(/^_|_$/g,'').slice(0,80) || 'document';
}

function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

// ---------- Real .docx (OOXML) export ----------
// Unlike the "Word (.doc)" export above (which is HTML that Word's compatibility layer opens),
// this builds an actual .docx package: a zip file containing the specific XML parts the OOXML
// format requires. More work, but the result is a genuine .docx some stricter uploaders/ATS
// systems expect rather than a renamed HTML file.
function escXml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function inchesToTwips(inches){ return Math.round(inches*1440); }

function docxRun(text, opts){
  opts = opts || {};
  let rPr = '';
  if(opts.bold || opts.size || opts.color || opts.font || opts.italic){
    rPr = '<w:rPr>'
      + (opts.font ? `<w:rFonts w:ascii="${escXml(opts.font)}" w:hAnsi="${escXml(opts.font)}"/>` : '')
      + (opts.bold ? '<w:b/>' : '')
      + (opts.italic ? '<w:i/>' : '')
      + (opts.size ? `<w:sz w:val="${Math.round(opts.size*2)}"/>` : '')
      + (opts.color ? `<w:color w:val="${opts.color}"/>` : '')
      + '</w:rPr>';
  }
  if(opts.tab) return `<w:r>${rPr}<w:tab/><w:t xml:space="preserve">${escXml(text)}</w:t></w:r>`;
  return `<w:r>${rPr}<w:t xml:space="preserve">${escXml(text)}</w:t></w:r>`;
}

function docxParagraph(runsXml, opts){
  opts = opts || {};
  let pPr = '';
  const parts = [];
  if(opts.align) parts.push(`<w:jc w:val="${opts.align}"/>`);
  if(opts.tabRightPos) parts.push(`<w:tabs><w:tab w:val="right" w:pos="${opts.tabRightPos}"/></w:tabs>`);
  if(opts.borderBottom) parts.push(`<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="2" w:color="C08A2E"/></w:pBdr>`);
  parts.push(`<w:spacing w:after="${opts.spacingAfter!=null ? opts.spacingAfter : 120}"/>`);
  if(opts.indentLeft) parts.push(`<w:ind w:left="${opts.indentLeft}"/>`);
  pPr = `<w:pPr>${parts.join('')}</w:pPr>`;
  return `<w:p>${pPr}${runsXml}</w:p>`;
}

async function buildDocxBlob(bodyParagraphsXml, pageMarginsIn){
  const m = pageMarginsIn || {top:1, bottom:1, left:1, right:1};
  const sectPr = `<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="${inchesToTwips(m.top)}" w:right="${inchesToTwips(m.right)}" w:bottom="${inchesToTwips(m.bottom)}" w:left="${inchesToTwips(m.left)}" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>`;
  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>
${bodyParagraphsXml.join('\n')}
${sectPr}
</w:body>
</w:document>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>
</Types>`;

  const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>
</Relationships>`;

  const coreXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/">
<dc:creator>Parcourai</dc:creator>
<dc:title>Document</dc:title>
</cp:coreProperties>`;

  const zip = new JSZip();
  zip.file('[Content_Types].xml', contentTypesXml);
  zip.folder('_rels').file('.rels', rootRelsXml);
  zip.folder('docProps').file('core.xml', coreXml);
  zip.folder('word').file('document.xml', documentXml);
  return await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

// ---------- Generic plain-document export (docx + PDF) ----------
// For content that isn't a résumé/cover-letter — interview prep notes, background pitch,
// self-discovery summaries, skills assessments. Splits on blank lines into paragraphs, and
// treats a short ALL-CAPS line as a section heading.
// Wraps occurrences of the given key phrases in **markdown-style** bold markers within plain
// text — used for downloads, where the output isn't HTML. Mirrors boldKeyPhrases' matching
// logic (longest phrase first, skip anything already marked) but on raw text instead of HTML.
function markBoldPhrasesPlain(text, phrases){
  let marked = text || '';
  const sorted = (phrases||[]).filter(p=>p && p.trim()).map(p=>p.trim()).sort((a,b)=>b.length-a.length);
  sorted.forEach(phrase=>{
    if(!phrase) return;
    const pattern = phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp('(' + pattern + ')', 'gi');
    marked = marked.replace(regex, (match, p1, offset, str)=>{
      const before = str.slice(Math.max(0, offset-2), offset);
      const after = str.slice(offset+match.length, offset+match.length+2);
      if(before === '**' && after === '**') return match; // already marked, leave as-is
      return '**' + p1 + '**';
    });
  });
  return marked;
}

// Turns a line containing **bold** markers into a concatenated string of DOCX runs — some
// bold, some not — so a single paragraph can mix formatting instead of being all-or-nothing.
function docxRunsFromMarkedText(text, baseOpts){
  baseOpts = baseOpts || {};
  return text.split(/(\*\*[^*]+\*\*)/g).filter(p=>p).map(part=>{
    if(part.startsWith('**') && part.endsWith('**') && part.length > 4){
      return docxRun(part.slice(2, -2), Object.assign({}, baseOpts, {bold:true}));
    }
    return docxRun(part, baseOpts);
  }).join('');
}

function plainTextToDocxParagraphs(title, bodyText){
  const paras = [docxParagraph(docxRun(title, {bold:true, size:18, color:'1F3A5F'}), {spacingAfter:200})];
  const blocks = bodyText.split(/\n\s*\n/);
  blocks.forEach(block=>{
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    lines.forEach((line, i)=>{
      const isHeading = i === 0 && line.length < 60 && line === line.toUpperCase() && /[A-Z]/.test(line) && !/[a-z]/.test(line);
      const isLastLineOfBlock = i === lines.length - 1;
      if(isHeading){
        paras.push(docxParagraph(docxRun(line, {bold:true, size:11, color:'1F3A5F'}), {spacingAfter:100, borderBottom:true}));
      } else {
        paras.push(docxParagraph(docxRunsFromMarkedText(line, {size:10.5}), {spacingAfter: isLastLineOfBlock ? 160 : 40}));
      }
    });
  });
  return paras;
}

async function downloadPlainTextDocx(title, bodyText, filename){
  try{
    const paras = plainTextToDocxParagraphs(title, bodyText);
    const blob = await buildDocxBlob(paras, {top:0.85, bottom:0.85, left:0.9, right:0.9});
    triggerDownload(blob, sanitizeFilename(filename.replace(/\.docx?$/,'')) + '.docx');
    toast(t('toastDocxDownloaded'));
  }catch(e){
    toast(t('toastDocxFailed'));
  }
}

// Renders a line that may contain **bold** markers, word by word, switching the PDF font
// weight per word and wrapping manually — jsPDF has no built-in mixed-run text API, so this
// measures each word at its correct weight and lays it out left to right itself, adding a
// page break when it runs off the bottom exactly like the plain-text path does.
function renderMixedTextPdf(doc, line, marginX, startY, maxWidth, pageHeight, lineHeight){
  let x = marginX, y = startY;
  const tokens = [];
  line.split(/(\*\*[^*]+\*\*)/g).forEach(part=>{
    if(!part) return;
    const isBold = part.startsWith('**') && part.endsWith('**') && part.length > 4;
    const raw = isBold ? part.slice(2, -2) : part;
    raw.split(/\s+/).filter(Boolean).forEach(word=>tokens.push({ word, bold: isBold }));
  });
  doc.setFont('helvetica', 'normal');
  const spaceWidth = doc.getTextWidth(' ');
  tokens.forEach(tok=>{
    doc.setFont('helvetica', tok.bold ? 'bold' : 'normal');
    const w = doc.getTextWidth(tok.word);
    const needsSpace = x > marginX;
    if(x + (needsSpace ? spaceWidth : 0) + w > marginX + maxWidth){
      x = marginX; y += lineHeight;
      if(y > pageHeight - 60){ doc.addPage(); y = 60; }
    } else if(needsSpace){
      x += spaceWidth;
    }
    doc.text(tok.word, x, y);
    x += w;
  });
  return y;
}

function downloadPlainTextPdf(title, bodyText, filename){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'letter'});
    const marginX = 60, pageWidth = 612, pageHeight = 792, maxWidth = pageWidth - marginX*2;
    let y = 60;
    doc.setFont('helvetica','bold'); doc.setFontSize(17);
    doc.setTextColor(31,58,95);
    doc.text(title, marginX, y);
    doc.setTextColor(22,27,34);
    y += 28;
    bodyText.split(/\n\s*\n/).forEach(block=>{
      const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
      lines.forEach((line, i)=>{
        const isHeading = i === 0 && line.length < 60 && line === line.toUpperCase() && /[A-Z]/.test(line) && !/[a-z]/.test(line);
        const isLastLineOfBlock = i === lines.length - 1;
        doc.setFontSize(isHeading ? 11.5 : 10.5);
        if(isHeading) doc.setTextColor(31,58,95); else doc.setTextColor(22,27,34);
        if(isHeading){
          doc.setFont('helvetica', 'bold');
          const wrapped = doc.splitTextToSize(line, maxWidth);
          wrapped.forEach(l=>{
            if(y > pageHeight - 60){ doc.addPage(); y = 60; }
            doc.text(l, marginX, y);
            y += 16;
          });
        } else {
          y = renderMixedTextPdf(doc, line, marginX, y, maxWidth, pageHeight, 15);
          y += 15;
        }
        y += isHeading ? 6 : (isLastLineOfBlock ? 10 : 2);
      });
    });
    doc.save(sanitizeFilename(filename.replace(/\.pdf$/,'')) + '.pdf');
    toast(t('toastPdfDownloaded'));
  }catch(e){
    toast(t('toastPdfFailed'));
  }
}

function resumeToDocxParagraphs(parsed){
  const paras = [];
  paras.push(docxParagraph(docxRun(parsed.name||'', {bold:true, size:20, color:'1F3A5F'}), {align:'center', spacingAfter:40}));
  if(parsed.contact) paras.push(docxParagraph(docxRun(parsed.contact, {size:9, color:'5B6570'}), {align:'center', spacingAfter:160, borderBottom:true}));
  parsed.sections.forEach(sec=>{
    if(sec.type==='paragraph' && !sec.text && !sec.header) return;
    if(sec.header) paras.push(docxParagraph(docxRun(sec.header.toUpperCase(), {bold:true, size:10.5, color:'1F3A5F'}), {spacingAfter:100, borderBottom:true}));
    if(sec.type==='paragraph'){
      paras.push(docxParagraph(docxRun(sec.text, {size:10.5}), {spacingAfter:160}));
    } else if(sec.type==='experience'){
      sec.entries.forEach(ent=>{
        const parts = ent.header.split('|').map(s=>s.trim());
        const [t,c,d] = [parts[0]||'', parts[1]||'', parts[2]||''];
        const titleLine = t + (c?'  —  '+c:'');
        paras.push(docxParagraph(docxRun(titleLine, {bold:true, size:11}) + docxRun(d, {tab:true, size:9.5, color:'5B6570'}), {tabRightPos:10224, spacingAfter:40}));
        ent.bullets.forEach(b=>{
          paras.push(docxParagraph(docxRun('•  '+b, {size:10}), {indentLeft:200, spacingAfter:40}));
        });
        paras.push(docxParagraph('', {spacingAfter:80}));
      });
    } else if(sec.type==='education'){
      sec.entries.forEach(l=>{
        const parts = l.split('|').map(s=>s.trim());
        const [deg,sch,yr] = [parts[0]||'', parts[1]||'', parts[2]||''];
        const line = deg + (sch?', '+sch:'');
        paras.push(docxParagraph(docxRun(line, {size:10.5}) + docxRun(yr, {tab:true, size:9.5, color:'5B6570'}), {tabRightPos:10224, spacingAfter:80}));
      });
    } else if(sec.type==='list'){
      paras.push(docxParagraph(docxRun(sec.items.join('   ·   '), {size:10}), {spacingAfter:160}));
    }
  });
  return paras;
}

function coverLetterToDocxParagraphs(paragraphs, profile, opts){
  const o = opts || {};
  const isFrench = o.lang === 'fr';
  const dateStr = new Date().toLocaleDateString(isFrench ? 'fr-FR' : 'en-US', {year:'numeric', month:'long', day:'numeric'});
  const paras = [];
  if(isFrench){
    const city = (profile.location||'').split(',')[0].trim();
    paras.push(docxParagraph(docxRun(`À ${city}${city?', ':''}le ${dateStr}`, {size:10.5}), {spacingAfter:220}));
  } else {
    paras.push(docxParagraph(docxRun(profile.name||'', {bold:true, size:15, color:'1F3A5F'}), {spacingAfter:20}));
    const contactParts = [profile.location, profile.email, profile.phone].filter(Boolean);
    if(contactParts.length) paras.push(docxParagraph(docxRun(contactParts.join('   ·   '), {size:9, color:'5B6570'}), {spacingAfter:120}));
    paras.push(docxParagraph(docxRun(dateStr, {size:10.5}), {spacingAfter:200}));
  }
  if(o.company || o.companyAddress){
    if(o.company) paras.push(docxParagraph(docxRun(o.company, {bold:true, size:10.5}), {spacingAfter:20}));
    (o.companyAddress||'').split(/\n|,\s*/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
      paras.push(docxParagraph(docxRun(line, {size:10.5}), {spacingAfter:20}));
    });
    paras.push(docxParagraph('', {spacingAfter:180}));
  }
  paras.push(docxParagraph(docxRun(coverLetterSubjectLine(o.title, o.lang), {bold:true, size:10.5}), {spacingAfter:180}));
  paragraphs.forEach(p=>{
    paras.push(docxParagraph(docxRun(p, {size:10.5}), {align:'both', spacingAfter:160}));
  });
  return paras;
}

function extractTextFromDocxFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const result = await mammoth.extractRawText({arrayBuffer: ev.target.result});
        resolve(result.value.trim());
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function extractTextFromPdfFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const pdf = await pdfjsLib.getDocument({data: ev.target.result}).promise;
        let text = '';
        for(let i=1; i<=pdf.numPages; i++){
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          text += content.items.map(it=>it.str).join(' ') + '\n';
        }
        resolve(text.trim());
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

async function mergeCvVersions(){
  const m = state.ui.cvMerge;
  if(!cvMergeFileObjects.length) return;
  m.loading = true; m.error = ""; m.mergedResume = ""; m.mergedProfileFields = null; m.appliedNote = "";
  render();

  const sections = [];
  for(const file of cvMergeFileObjects){
    const name = file.name.toLowerCase();
    try{
      let text = '';
      if(name.endsWith('.docx')) text = await extractTextFromDocxFile(file);
      else if(name.endsWith('.pdf')) text = await extractTextFromPdfFile(file);
      else { sections.push(`--- ${file.name} ---\n(Unsupported file type — only .docx and .pdf are read. Skipped.)`); continue; }
      sections.push(`--- ${file.name} ---\n${text || '(No text could be read from this file.)'}`);
    }catch(err){
