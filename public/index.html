<script>
if(!window.storage){
  const NS = 'parcoura::';
  window.storage = {
    async get(key, shared){
      const raw = localStorage.getItem(NS+key);
      if(raw === null) throw new Error('Key not found: '+key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem(NS+key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      const existed = localStorage.getItem(NS+key) !== null;
      localStorage.removeItem(NS+key);
      return { key, deleted: existed, shared: !!shared };
    },
    async list(prefix, shared){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(NS+(prefix||''))) keys.push(k.slice(NS.length));
      }
      return { keys, prefix, shared: !!shared };
    }
  };
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
  });
}
</script>

<!--
  ============================================================================
  FIREBASE INTEGRATION — Stage 1: Authentication + Profile
  ============================================================================
  Replace the firebaseConfig object below with YOUR project's config, copied
  from Firebase Console → Project Settings → your registered web app.
  This config is not a secret — it's safe to have visible in page source.

  This is a module script (type="module"), which is why it's separate from
  the main app script above: ES module imports only work inside a module
  script. It exposes plain functions on `window.firebase*` so the main app
  script (a classic, non-module script) can call them normally.

  Scope of this stage: real sign-up/sign-in/sign-out/password-reset, and
  saving/loading the Profile tab to Firestore. Applications, chat, and
  everything else still use the existing localStorage-based window.storage
  for now — those get migrated in later stages, the same way.
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signOut, onAuthStateChanged, sendPasswordResetEmail,
    reauthenticateWithCredential, updatePassword, EmailAuthProvider, verifyBeforeUpdateEmail,
    setPersistence, browserLocalPersistence, browserSessionPersistence
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, getDoc, collection, getDocs, writeBatch, deleteDoc, addDoc
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  import {
    getStorage, ref, uploadString, getDownloadURL, deleteObject
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

  // ↓↓↓ REPLACE THIS WITH YOUR OWN CONFIG FROM THE FIREBASE CONSOLE ↓↓↓
  const firebaseConfig = {
    apiKey: "AIzaSyCoeLRigHk4V7aejvwK1nxt9ChAG5uKEwA",
    authDomain: "parcoura-prod.firebaseapp.com",
    projectId: "parcoura-prod",
    storageBucket: "parcoura-prod.firebasestorage.app",
    messagingSenderId: "899738041447",
    appId: "1:899738041447:web:81de8424055efdd01928c2"
  };
  // ↑↑↑ REPLACE THIS WITH YOUR OWN CONFIG FROM THE FIREBASE CONSOLE ↑↑↑

  const app = initializeApp(firebaseConfig);

  // App Check — proves requests are coming from this real app, not a bot or script
  // hitting Firebase directly. Must be initialized before Auth/Firestore/Storage are
  // used, so every request from here on carries a token. Enforcement isn't turned on
  // in the Firebase console yet, so nothing is actually blocked until that's flipped
  // on deliberately, after confirming this doesn't break normal sign-up/sign-in.
  // App Check has a known, unresolved issue (a Google-side permission gap that
  // couldn't be fixed despite real troubleshooting) causing it to fail with a
  // 400 error. Wrapped in try/catch so that failure can NEVER take down the
  // rest of this script — without this, an uncaught error here would silently
  // prevent every window.firebase* function below from ever being defined,
  // breaking sign-in, Firestore, and everything else app-wide.
  try{
    initializeAppCheck(app, {
      provider: new ReCaptchaEnterpriseProvider('6Ld3LKItAAAAAPqLMoQuVQa_3enETnF3K4XvaoAb'),
      isTokenAutoRefreshEnabled: true
    });
  }catch(e){
    console.warn('App Check failed to initialize — continuing without it:', e);
  }
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  window.firebaseSignUp = (email, password) =>
    createUserWithEmailAndPassword(auth, email, password);

  window.firebaseSignIn = (email, password) =>
    signInWithEmailAndPassword(auth, email, password);

  window.firebaseSignOutUser = () => signOut(auth);

  // "Remember me" — browserLocalPersistence keeps the session across browser
  // restarts; browserSessionPersistence (the default otherwise) clears it
  // when the browser closes. Must be set BEFORE signInWithEmailAndPassword
  // for it to take effect on that sign-in.
  window.firebaseSetAuthPersistence = (remember) =>
    setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);

  window.firebaseSendPasswordReset = (email) =>
    sendPasswordResetEmail(auth, email);

  // Firebase requires re-proving the current password before allowing a change
  // to a sensitive account property like the password itself — this is a
  // security feature, not extra friction Parcourai added.
  window.firebaseChangePassword = async (currentPassword, newPassword) => {
    const user = auth.currentUser;
    if(!user) throw { code: 'auth/no-current-user' };
    const credential = EmailAuthProvider.credential(user.email, currentPassword);
    await reauthenticateWithCredential(user, credential);
    await updatePassword(user, newPassword);
  };

  // Uses verifyBeforeUpdateEmail rather than the older direct updateEmail — Firebase sends a
  // confirmation link to the NEW address first, and the email only actually changes once that
  // link is clicked. This avoids someone locking themselves (or someone else) out by mistyping
  // a new email with no way to verify it belongs to them.
  window.firebaseUpdateEmail = async (currentPassword, newEmail) => {
    const user = auth.currentUser;
    if(!user) throw { code: 'auth/no-current-user' };
    const credential = EmailAuthProvider.credential(user.email, currentPassword);
    await reauthenticateWithCredential(user, credential);
    await verifyBeforeUpdateEmail(user, newEmail);
  };

  window.firebaseGetAccountInfo = () => {
    const user = auth.currentUser;
    if(!user) return null;
    return { email: user.email, createdAt: user.metadata.creationTime };
  };

  // Needed to prove to the backend that a checkout request genuinely comes from
  // a signed-in session — see create-checkout-session.js for why this matters.
  window.firebaseGetIdToken = async () => {
    const user = auth.currentUser;
    if(!user) return null;
    return await user.getIdToken();
  };

  // The contact form needs to work for people who aren't signed in at all, so
  // this writes to its own collection with its own security rule (write-only,
  // no read access from the client) rather than requiring an account. There's
  // no email-sending service wired up, so messages are reviewed directly in
  // the Firebase Console — same place other app data is already reviewed.
  window.firebaseSubmitContactMessage = (data) =>
    addDoc(collection(db, 'contactMessages'), { ...data, submittedAt: new Date().toISOString() });

  // Fires once on load with the currently-signed-in user (or null), and again
  // any time sign-in/sign-out happens elsewhere — this is what lets a session
  // persist across page reloads instead of asking to sign in every time.
  window.firebaseOnAuthChange = (callback) => onAuthStateChanged(auth, callback);

  window.firebaseSaveProfile = (uid, profileData) =>
    setDoc(doc(db, 'users', uid), profileData, { merge: true });

  window.firebaseGetProfile = async (uid) => {
    const snap = await getDoc(doc(db, 'users', uid));
    return snap.exists() ? snap.data() : null;
  };

  // ==========================================================================
  // FIREBASE INTEGRATION — Stage 2: Applications + Analyses
  // ==========================================================================
  // Both are modeled as subcollections (one document per item, keyed by the
  // item's own `id`) rather than one big array field — this is what lets a
  // single application be read or updated on its own later (e.g. a future
  // admin/reporting view) instead of always loading everyone's whole list.
  //
  // syncSubcollection reads what's currently in Firestore, then in a single
  // batch: writes every item currently in the array (create-or-update), and
  // deletes any Firestore document whose id is no longer present in the
  // array. One batch commit either fully succeeds or fully fails — there's
  // no risk of ending up with half the applications saved and half not.
  //
  // Trade-off worth knowing: this reads the whole existing collection on
  // every save to detect deletions, which is fine at the scale of dozens of
  // applications per user, but would be worth optimizing (e.g. deleting a
  // specific document directly when the user clicks delete, instead of
  // diffing on every save) if this ever needs to scale much further.
  async function syncSubcollection(uid, subcollectionName, items){
    const colRef = collection(db, 'users', uid, subcollectionName);
    const existingSnap = await getDocs(colRef);
    const existingIds = new Set(existingSnap.docs.map(d => d.id));
    const currentIds = new Set(items.map(item => String(item.id)));

    const batch = writeBatch(db);
    items.forEach(item => {
      batch.set(doc(db, 'users', uid, subcollectionName, String(item.id)), item);
    });
    existingIds.forEach(id => {
      if(!currentIds.has(id)) batch.delete(doc(db, 'users', uid, subcollectionName, id));
    });
    await batch.commit();
  }

  async function getSubcollection(uid, subcollectionName){
    const snap = await getDocs(collection(db, 'users', uid, subcollectionName));
    return snap.docs.map(d => d.data());
  }

  window.firebaseSaveApplications = (uid, applications) => syncSubcollection(uid, 'applications', applications);
  window.firebaseGetApplications = (uid) => getSubcollection(uid, 'applications');
  window.firebaseSaveAnalyses = (uid, analyses) => syncSubcollection(uid, 'analyses', analyses);
  window.firebaseGetAnalyses = (uid) => getSubcollection(uid, 'analyses');

  // ==========================================================================
  // FIREBASE INTEGRATION — Stage 3: Everything else
  // ==========================================================================
  // Generic single-document "settings blob" storage for the many features that
  // only ever have ONE value per user (self-reflection, career path, job
  // strategy, etc.) — wraps the value under a `data` field so this works
  // uniformly whether the value is an object, array, or plain string (like
  // uiLang), rather than needing a bespoke function for each one.
  window.firebaseSaveMeta = (uid, metaKey, data) =>
    setDoc(doc(db, 'users', uid, 'meta', metaKey), { data });

  window.firebaseGetMeta = async (uid, metaKey) => {
    const snap = await getDoc(doc(db, 'users', uid, 'meta', metaKey));
    return snap.exists() ? snap.data().data : null;
  };

  // Generic subcollection helpers, reused for job accounts, chat folders/
  // conversations, and improvement goals — same create/update/delete-diff
  // pattern already proven for applications and analyses above.
  window.firebaseSaveSubcollection = (uid, name, items) => syncSubcollection(uid, name, items);
  window.firebaseGetSubcollection = (uid, name) => getSubcollection(uid, name);

  // Real file storage — this is what removes the 3.5MB-per-file cap the app
  // had while files were being base64-encoded into Firestore text fields.
  // Storage handles actual binary files directly, at Firebase's much larger
  // limits (5GB per file), with no base64 inflation overhead.
  window.firebaseUploadFile = async (uid, fileId, dataUrl) => {
    const fileRef = ref(storage, `users/${uid}/files/${fileId}`);
    await uploadString(fileRef, dataUrl, 'data_url');
    return await getDownloadURL(fileRef);
  };

  window.firebaseGetFileUrl = async (uid, fileId) => {
    const fileRef = ref(storage, `users/${uid}/files/${fileId}`);
    return await getDownloadURL(fileRef);
  };

  window.firebaseDeleteFile = async (uid, fileId) => {
    const fileRef = ref(storage, `users/${uid}/files/${fileId}`);
    try{ await deleteObject(fileRef); }catch(e){ /* already gone is fine */ }
  };
</script>

      position:fixed; top:14px; left:14px; z-index:55;

      background:var(--primary); color:#fff; font-size:20px; box-shadow:0 2px 8px rgba(0,0,0,0.2);

  .tag-input-row{display:flex;gap:8px;margin-top:6px;}

  .list-item{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;background:#FCFDFB;}

  .list-item-title{font-weight:600;font-size:14px;}

  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:15px;padding:2px 6px;}

  /* Pipeline / signature element */

  .pipeline-stage .dot{width:12px;height:12px;border-radius:50%;background:var(--line);margin:0 auto 6px auto;
    border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);}
  .pipeline-stage.done .dot{background:var(--primary);box-shadow:0 0 0 1px var(--primary);}
  .pipeline-stage.current .dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .pipeline-stage.rejected .dot{background:var(--danger);box-shadow:0 0 0 1px var(--danger);}

  .pipeline-stage:first-child .pipeline-track{display:none;}
  .pipeline-stage.done .pipeline-track, .pipeline-stage.current .pipeline-track{background:var(--primary);}
  .pipeline-label{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);}
  .pipeline-stage.current .pipeline-label{color:var(--accent);font-weight:600;}

  .app-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px;

  .app-card:hover{box-shadow:0 4px 18px rgba(31,58,95,0.07);}
  .app-card-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .app-role{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--primary);}
  .app-company{color:var(--muted);font-size:13px;}
  .app-meta{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:2px;}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);}

  .sidebar .lang-toggle button.active{background:var(--accent);color:#fff;}

<script>
// ---------- Production error reporting ----------
// Reports uncaught errors to /api/log-error so staff can see real production
// failures (Error Logs card on the Staff dashboard) instead of only hearing
// about them secondhand from users. Capped at 5 reports per page load so a
// broken loop of repeated errors can't spam the endpoint indefinitely.
let _errorReportCount = 0;
function reportErrorToServer(message, stack){
  if(_errorReportCount >= 5) return;
  _errorReportCount++;
  try{
    fetch('/api/log-error', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: String(message).slice(0, 2000),
        stack: stack ? String(stack).slice(0, 4000) : null,
        url: window.location.href,
        uid: (typeof state !== 'undefined' && state.currentUser) ? state.currentUser.username : null
      })
    }).catch(()=>{ /* if logging itself fails, there's nothing useful to do about it here */ });
  }catch(e){ /* ignore — never let error reporting itself throw */ }
}
window.addEventListener('error', (event)=>{
  reportErrorToServer(event.message, event.error && event.error.stack);
});
window.addEventListener('unhandledrejection', (event)=>{
  const reason = event.reason;
  reportErrorToServer(reason && reason.message ? reason.message : String(reason), reason && reason.stack);
});

const STAGES = ["saved","tailored","applied","interviewing","offer"];
const STAGE_KEYS = {saved:"stageSaved", tailored:"stageTailored", applied:"stageApplied", interviewing:"stageInterviewing", offer:"stageOffer", rejected:"stageRejected"};
function stageLabel(stage){ return t(STAGE_KEYS[stage]) || stage; }
const STAGE_COLORS = {
  saved:      {bg:'var(--paper)',        fg:'var(--muted)'},
  tailored:   {bg:'var(--accent-soft)',  fg:'#7A5A16'},
  applied:    {bg:'var(--primary-soft)', fg:'var(--primary)'},
  interviewing: {bg:'var(--accent-soft)', fg:'#7A5A16'},
  offer:      {bg:'var(--success-soft)', fg:'var(--success)'},
  rejected:   {bg:'var(--danger-soft)',  fg:'var(--danger)'}
};
function stageBadgeHtml(stage){
  const c = STAGE_COLORS[stage] || STAGE_COLORS.saved;
  return `<span class="page-badge" style="background:${c.bg};color:${c.fg};">${stageLabel(stage)}</span>`;
}

// Color tier for a compatibility score: green = strong match, amber = worth a look, red = long shot.
function scoreColorInfo(score){
  if(score>=75) return {bg:'var(--success-soft)', fg:'var(--success)'};
  if(score>=50) return {bg:'var(--accent-soft)', fg:'#7A5A16'};
  return {bg:'var(--danger-soft)', fg:'var(--danger)'};
}
function scoreBadgeHtml(score){
  if(typeof score !== 'number') return '';
  const c = scoreColorInfo(score);
  return `<span class="page-badge" style="background:${c.bg};color:${c.fg};font-weight:700;">${score}% match</span>`;
}
const JOB_CLASSIFICATION_COLORS = {
  managerial:    {bg:'var(--success-soft)', fg:'var(--success)'},
  administrative:{bg:'#EDE7F6', fg:'#5E35B1'},
  logistics:     {bg:'#FFEB3B', fg:'#7A6A00'},
  other:         {bg:'var(--paper)', fg:'var(--muted)'}
};
const JOB_CLASSIFICATION_LABEL_KEYS = {
  managerial: 'classificationManagerial', administrative: 'classificationAdministrative',
  logistics: 'classificationLogistics', other: 'classificationOther'
};
// Shows a badge for every classified job, including "other" (in a neutral gray) rather than
// just staying blank — a blank badge is indistinguishable from "not classified yet", which made
// it impossible to tell whether the feature had actually run on a given analysis.
function classificationBadgeHtml(cls){
  if(!JOB_CLASSIFICATION_COLORS[cls]) return '';
  const c = JOB_CLASSIFICATION_COLORS[cls];
  const label = t(JOB_CLASSIFICATION_LABEL_KEYS[cls]);
  return `<span class="page-badge" style="background:${c.bg};color:${c.fg};">${esc(label)}</span>`;
}
// Sorts analyses/applications so the highest compatibility score comes first; items with no
// score yet sort last, and ties fall back to most recently updated.
function sortByScoreDesc(items, dateField){
  return items.slice().sort((a,b)=>{
    const as = typeof a.compatibilityScore==='number' ? a.compatibilityScore : -1;
    const bs = typeof b.compatibilityScore==='number' ? b.compatibilityScore : -1;
    if(bs!==as) return bs-as;
    return (b[dateField]||0)-(a[dateField]||0);
  });
}

// Groups Job Analyzer analyses into sections by stage (Saved, Tailored, Applied, Interviewing,
// Offer, Rejected), each with a color-coded header, instead of one flat mixed list.
function groupedAnalysesHtml(analyses){
  const order = [...STAGES, 'rejected'];
  const activeTab = state.ui.analysisStatusTab; // null = show all stages
  const activeClassTab = state.ui.analysisClassificationTab; // null | 'managerial' | 'administrative'

  const classFiltered = activeClassTab ? analyses.filter(a=>a.jobClassification===activeClassTab) : analyses;

  const allGroups = order.map(stage=>({
    stage,
    items: sortByScoreDesc(classFiltered.filter(a=>(a.stage||'saved')===stage), 'updatedAt')
  }));
  const groups = allGroups
    .filter(g=>g.items.length>0)
    .filter(g=>!activeTab || g.stage===activeTab);

  const managerialCount = analyses.filter(a=>a.jobClassification==='managerial').length;
  const administrativeCount = analyses.filter(a=>a.jobClassification==='administrative').length;
  const logisticsCount = analyses.filter(a=>a.jobClassification==='logistics').length;

  const classTabsHtml = (managerialCount || administrativeCount || logisticsCount) ? `
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">
      <button class="btn btn-sm ${!activeClassTab?'btn-primary':'btn-ghost'}" data-analysis-classification-tab="">
        ${esc(t('tabAllTypes'))} (${analyses.length})
      </button>
      ${managerialCount ? `<button class="btn btn-sm ${activeClassTab==='managerial'?'btn-primary':'btn-ghost'}" data-analysis-classification-tab="managerial">${esc(t('classificationManagerial'))} (${managerialCount})</button>` : ''}
      ${administrativeCount ? `<button class="btn btn-sm ${activeClassTab==='administrative'?'btn-primary':'btn-ghost'}" data-analysis-classification-tab="administrative">${esc(t('classificationAdministrative'))} (${administrativeCount})</button>` : ''}
      ${logisticsCount ? `<button class="btn btn-sm ${activeClassTab==='logistics'?'btn-primary':'btn-ghost'}" data-analysis-classification-tab="logistics">${esc(t('classificationLogistics'))} (${logisticsCount})</button>` : ''}
    </div>
  ` : '';

  const tabsHtml = `
    ${classTabsHtml}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">
      <button class="btn btn-sm ${!activeTab?'btn-primary':'btn-ghost'}" data-analysis-status-tab="">
        ${esc(t('tabAllStages'))} (${classFiltered.length})
      </button>
      ${order.map(stage=>{
        const count = allGroups.find(g=>g.stage===stage).items.length;
        if(count===0) return '';
        return `<button class="btn btn-sm ${activeTab===stage?'btn-primary':'btn-ghost'}" data-analysis-status-tab="${stage}">${esc(stageLabel(stage))} (${count})</button>`;
      }).join('')}
    </div>
    <div class="hint" style="margin-bottom:16px;">${esc(t('sortHighestFirst'))}</div>
  `;

  return tabsHtml + groups.map(g=>{
    const c = STAGE_COLORS[g.stage] || STAGE_COLORS.saved;
    return `
      <div style="display:flex;align-items:center;gap:8px;margin:22px 0 10px 0;">
        <div style="width:8px;height:8px;border-radius:50%;background:${c.fg};flex-shrink:0;"></div>
        <div style="font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:${c.fg};">${stageLabel(g.stage)}</div>
        <div style="font-size:11px;color:var(--muted);">(${g.items.length})</div>
        <div style="flex:1;height:1px;background:var(--line);"></div>
      </div>
      ${g.items.map(an=>`
        <div class="app-card" data-open-analysis="${an.id}" style="cursor:pointer;border-left:3px solid ${c.fg};">
          <div class="app-card-top">
            <div>
              <div class="app-role">${esc(an.title)||esc(t('untitledRole'))} ${scoreBadgeHtml(an.compatibilityScore)} ${classificationBadgeHtml(an.jobClassification)}</div>
              <div class="app-company">${esc(an.company)||'—'}</div>
              <div class="app-meta">${esc(t('metaUpdated'))} ${new Date(an.updatedAt).toLocaleDateString(state.uiLang==='fr'?'fr-FR':'en-US')} · ${an.lang==='fr'?'FR':'EN'} ${an.resume?'· '+esc(t('metaHasDocuments')):'· '+esc(t('metaDraft'))}</div>
            </div>
            <button class="icon-btn" data-delete-analysis="${an.id}" title="${esc(t('tooltipDelete'))}">✕</button>
          </div>
        </div>
      `).join('')}
    `;
  }).join('');
}

function t(key){
  const lang = state.uiLang === 'fr' ? 'fr' : 'en';
  return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
}

// "Remove N duplicate(s)" — used identically across Background, Skills
// Assessment, and Self-Discovery, so this is a single shared helper rather
// than six copies of the same hardcoded English string.
function removeDuplicatesLabel(n){
  if(state.uiLang === 'fr') return `Retirer ${n} doublon${n===1?'':'s'}`;
  return `Remove ${n} duplicate${n===1?'':'s'}`;
}

// "Regenerate CV & cover letter with N selected keyword(s)" — French needs three separate
// plural agreements (mot→mots, clé→clés, sélectionné→sélectionnés), which a single {s}
// placeholder can't express correctly, so this is a dedicated function rather than a
// dictionary lookup.
function regenerateWithKeywordsLabel(n){
  if(state.uiLang === 'fr'){
    return n === 1
      ? `Régénérer le CV et la lettre avec ${n} mot-clé sélectionné`
      : `Régénérer le CV et la lettre avec ${n} mots-clés sélectionnés`;
  }
  return `Regenerate CV & cover letter with ${n} selected keyword${n===1?'':'s'}`;
}

// Case-insensitive, whitespace-trimmed dedupe for tag-style lists (skills, strengths, etc.)
// Keeps the first occurrence's original casing/spacing.
function dedupeList(arr){
  const seen = new Set();
  const result = [];
  (arr||[]).forEach(item=>{
    if(typeof item !== 'string') return;
    const key = item.trim().toLowerCase();
    if(key && !seen.has(key)){ seen.add(key); result.push(item.trim()); }
  });
  return result;
}
function countDuplicates(arr){
  return (arr||[]).length - dedupeList(arr).length;
}

// Counts duplicates across a combined list of {value} entries (used where skills and
// certifications are shown together, so a cert that repeats a skill counts as a duplicate too).
function countCombinedDuplicates(entries){
  const seen = new Set();
  let count = 0;
  (entries||[]).forEach(e=>{
    const key = (e.value||'').trim().toLowerCase();
    if(!key) return;
    if(seen.has(key)) count++; else seen.add(key);
  });
  return count;
}

// Scores how "complete" an application is, so when two entries turn out to be duplicates
// of the same real job, the cleanup keeps the one with the most actual progress on it
// rather than an arbitrary pick.
function scoreApplicationCompleteness(a){
  let score = 0;
  if(a.resume) score += 2;
  if(a.coverLetter) score += 1;
  if(a.stage && a.stage !== 'saved') score += 2;
  if(a.dateOfApplication) score += 1;
  if(a.hrName || a.hrEmail) score += 1;
  if(a.interviewComponents && a.interviewComponents.length) score += 1;
  if(a.practiceQuestions && a.practiceQuestions.length) score += 1;
  return score;
}

// Groups applications representing the same real job — an exact analysisId match, or (when
// no such link exists) an identical title + company — and keeps only the most complete one
// per group. Two entries only ever get compared this way if they'd otherwise be considered
// the same job, so a genuine second application to the same role at a different time is only
// at risk if it also shares the exact same analysisId or title+company as another entry.
function dedupeApplicationsList(apps){
  const groups = new Map();
  apps.forEach(a=>{
    const key = a.analysisId ? 'id:'+a.analysisId : 'nc:'+(a.title||'').trim().toLowerCase()+'|'+(a.company||'').trim().toLowerCase();
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(a);
  });
  const kept = [];
  groups.forEach(group=>{
    if(group.length === 1){ kept.push(group[0]); return; }
    let best = group[0], bestScore = scoreApplicationCompleteness(best);
    for(let i=1;i<group.length;i++){
      const score = scoreApplicationCompleteness(group[i]);
      if(score > bestScore || (score === bestScore && group[i].createdAt < best.createdAt)){
        best = group[i]; bestScore = score;
      }
    }
    kept.push(best);
  });
  return kept;
}

function countApplicationDuplicates(apps){
  return apps.length - dedupeApplicationsList(apps).length;
}

function removeDuplicateApplications(){

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function loadAll(){
  // If someone lands directly on a URL like /privacy-policy (a fresh visit,
  // a bookmark, or a page refresh), show that page immediately rather than
  // always defaulting to the landing page.
  const initialPage = publicPageForPath(window.location.pathname);
  if(initialPage) state.publicPage = initialPage;
  if(window.location.pathname === '/staff-login') state.showStaffLogin = true;

  // Stripe redirects back here after checkout with ?checkout=success or
  // ?checkout=cancel. The webhook that actually marks the subscription active
  // fires asynchronously and may arrive slightly after this redirect, so this
  // shows a "thanks, activating" message rather than assuming access is
  // already updated — the next profile reload will reflect the real status.
  const checkoutResult = new URLSearchParams(window.location.search).get('checkout');
  if(checkoutResult){
    history.replaceState({}, '', window.location.pathname); // strip the query param so refreshing doesn't repeat this
    if(checkoutResult === 'success') state.ui.pendingToast = "Thanks! Your subscription is being activated — this usually takes just a few seconds.";
    else if(checkoutResult === 'cancel') state.ui.pendingToast = "Checkout was canceled — no charge was made.";
  }

  try{
    const d = await window.storage.get(DIRECTORY_KEY, true);
    if(d) state.usersDirectory = JSON.parse(d.value);
  }catch(e){ state.usersDirectory = []; }
  state.loaded = true;
  render();

  // Firebase fires this once immediately with whoever's already signed in
  // (or null), and again on every future sign-in/sign-out — this is what
  // keeps someone signed in across a page reload instead of asking them to
  // sign in every single time they open the app.
  window.firebaseOnAuthChange(async (user)=>{
    if(user && !state.currentUser){
      state.currentUser = { username: user.uid, displayName: user.email };
      await loadUserData();
      // Restore whichever tab was open before the last refresh/reopen, instead
      // of always dropping back to Profile. Only restore 'staff' if this
      // account genuinely still has staff access — otherwise fall back to the
      // default rather than showing a tab this account can no longer use.
      try{
        const savedTab = localStorage.getItem('parcouraiLastTab');
        if(savedTab && (savedTab !== 'staff' || hasStaffAccess())) state.tab = savedTab;
      }catch(e){ /* storage unavailable — just use the default tab */ }
      if(state.tab === 'staff' && hasStaffAccess()){
        if(!state.staffStats && !state.ui.staffStatsLoading) loadStaffStats();
        if(!state.staffList && !state.ui.staffListLoading) loadStaffList();
      }
      render();
      if(state.ui.pendingToast){ toast(state.ui.pendingToast); state.ui.pendingToast = null; }
    } else if(!user && state.currentUser){
      state.currentUser = null;
      state.tab = "profile";
      render();
    }
  });
}

// Turns Firebase's error codes into the same plain-language messages the app
// already used, so the UI doesn't need to change to show them.
function firebaseAuthErrorMessage(e){
  const code = e && e.code || '';
  if(code === 'auth/email-already-in-use') return t('errEmailAlreadyInUse');
  if(code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') return t('errIncorrectEmailPassword');
  if(code === 'auth/weak-password') return t('errPasswordMustBe') + " " + passwordRulesText() + ".";
  if(code === 'auth/too-many-requests') return t('errTooManyAttempts');
  return t('errSomethingWentWrong');
}

// Classifies job postings that don't have a managerial/administrative/logistics/other tag yet —
// covers both analyses (Job Analyzer list) and any applications saved before this
// field existed or that no longer have a matching analysis.
//
// Processed in small batches rather than one giant request: with 100+ saved analyses,
// a single request asking the model to classify all of them at once risks the JSON
// response getting truncated (the same "thinking tokens eat the budget" failure mode
// seen elsewhere in this app) or the serverless function timing out — and either way,
// the whole backfill would silently produce nothing. Small batches mean most items get
// classified and show up right away even if one particular batch fails, and each
// batch's own failure is logged separately so a real cause is actually diagnosable.
const JOB_CLASSIFY_BATCH_SIZE = 12;

async function classifyJobItemsWithAI(items){
  if(!items.length) return {};
  const prompt = `Classify each of the following job postings as exactly one of "managerial", "administrative", "logistics", or "other".
Use "managerial" for roles with people-management, supervisory, team-leadership, or strategic/budget decision-making responsibilities (e.g. Manager, Director, Team Lead, Supervisor, Head of X).
Use "administrative" for office/operations support work — coordination, scheduling, clerical, data entry, records, general office administration (e.g. Administrative Assistant, Office Coordinator, Executive Assistant, Data Entry Clerk).
Use "logistics" for supply chain, warehousing, inventory, transportation, shipping/receiving, dispatch, or distribution roles (e.g. Logistics Coordinator, Warehouse Associate, Supply Chain Analyst, Dispatcher, Fleet Manager, Inventory Clerk).
Use "other" for anything that is neither (technical, sales, engineering, creative, healthcare-delivery roles with no management, admin, or logistics focus).
Respond with a JSON array only (no markdown fences, no preamble) with exactly ${items.length} objects, one per input item in the same order, each: {"id": "<same id as given, copied exactly>", "job_classification": "managerial"|"administrative"|"logistics"|"other"}.

JOBS:
${JSON.stringify(items)}`;
  const raw = await callClaude(prompt, "You always respond with a single valid JSON array and nothing else.", Math.min(1500 + items.length * 250, 8000));
  const parsed = JSON.parse(stripFences(raw));
  const map = {};
  (Array.isArray(parsed) ? parsed : []).forEach(p=>{ if(p && p.id) map[p.id] = p.job_classification; });
  return map;
}

async function backfillJobClassifications(){
  if(state.ui.classifyingOldJobs) return;
  const analysisTargets = state.analyses.filter(a=>a.jobClassification==null && a.desc);
  const appTargets = state.applications.filter(a=>a.jobClassification==null && a.jobDesc);
  if(!analysisTargets.length && !appTargets.length) return;
  state.ui.classifyingOldJobs = true;

  const allTargets = [
    ...analysisTargets.map(a=>({kind:'analysis', ref:a, id:'an_'+a.id, title:a.title||'', desc:(a.desc||'').slice(0,1200)})),
    ...appTargets.map(a=>({kind:'application', ref:a, id:'ap_'+a.id, title:a.title||'', desc:(a.jobDesc||'').slice(0,1200)}))
  ];

  for(let i=0; i<allTargets.length; i+=JOB_CLASSIFY_BATCH_SIZE){
    const batch = allTargets.slice(i, i+JOB_CLASSIFY_BATCH_SIZE);
    try{
      const map = await classifyJobItemsWithAI(batch.map(b=>({id:b.id, title:b.title, desc:b.desc})));
      let changedAnalyses = false, changedApps = false;
      batch.forEach(b=>{
        const cls = map[b.id];
        if(!['managerial','administrative','logistics','other'].includes(cls)) return;
        b.ref.jobClassification = cls;
        if(b.kind==='analysis'){
          changedAnalyses = true;
          const linkedApp = state.applications.find(app=>app.analysisId===b.ref.id);
          if(linkedApp && linkedApp.jobClassification==null){ linkedApp.jobClassification = cls; changedApps = true; }
        }else{
          changedApps = true;
        }
      });
      if(changedAnalyses) await saveAnalyses();
      if(changedApps) await saveApplications();
      if(changedAnalyses || changedApps) render();
    }catch(e){
      // Never interrupt the user with an error for this background backfill — but DO surface it
      // to the console and the same error-reporting pipeline as everything else, so a real failure
      // is actually diagnosable, and keep going with the next batch rather than aborting entirely
      // over one bad batch.
      console.error(`backfillJobClassifications batch ${i}-${i+batch.length} failed:`, e);
      reportErrorToServer('backfillJobClassifications batch ' + i + '-' + (i+batch.length) + ': ' + (e && e.message ? e.message : String(e)), e && e.stack);
    }
  }
  state.ui.classifyingOldJobs = false;
}

// A user has real access to paid features if either:
//   - their Stripe subscription is active or currently in its free trial (written
//     into their profile document by the webhook whenever Stripe reports a change), or
//   - they've been manually granted free access via the `comped` field on their
//     own profile document — this is the SAME mechanism whether it's granted to
//     the app owner's own account or to anyone else; there's no separate
//     "owner" code path, just one flag anyone with Firestore access can set.
//
// Granting free access to someone: open Firebase Console → Firestore → users
// collection → find their document (by uid) → add a field `comped` set to the
// boolean value `true`. To revoke it, set it back to `false` or delete the field.
function hasActiveAccess(){
  const sub = state.profile.subscription;
  const isSubscribed = sub && (sub.status === 'active' || sub.status === 'trialing');
  const isComped = state.profile.comped === true;
  return isSubscribed || isComped;
}

// This client-side check controls whether the Staff nav item is even shown —
// it is NOT the real security boundary. The actual enforcement happens
// server-side in /api/staff-dashboard-stats.js, which independently re-checks
// this same role directly from Firestore before returning any data. A user
// could theoretically fake this client-side check via devtools, but that
// alone would get them nothing, since the backend never trusts it.
//
// Granting staff access: same mechanism as `comped` — Firebase Console →
// Firestore → users → find the person's document → add a field `role` set to
// the string "staff" or "admin".
function hasStaffAccess(){
  return state.profile.role === 'staff' || state.profile.role === 'admin';
}

// The user's own research notes on the Companies directory (contact name, contact email,
// outreach status, free-text notes) — entirely their own data, filled in by hand, kept
// separate from the static CANADA_MULTINATIONALS reference list so re-syncing/expanding
// that list later never touches what the user has typed in.
function companyContactSlug(name){
  return String(name||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
}
// Custom links the user types into the Companies table (LinkedIn / careers overrides) are
// often typed without a scheme, e.g. "linkedin.com/company/acme" — as a bare href that's a
// relative link on THIS site, so it silently goes nowhere. Normalize to an absolute https://
// URL whenever one isn't already present, so every link actually opens.
function ensureHttpUrl(url){
  const trimmed = String(url||'').trim();
  if(!trimmed) return '';
  if(/^(https?:|mailto:|tel:)/i.test(trimmed)) return trimmed;
  return 'https://' + trimmed;
}
function getCompanyContact(name){
  const slug = companyContactSlug(name);
  return state.companyContacts[slug] || {contactName:'', contactEmail:'', status:'', notes:'', ceoOverride:'', careersUrlOverride:'', linkedinUrlOverride:'', positionOverride:'', unsolicited:null};
}
function updateCompanyContactField(name, field, value){
  updateCompanyContactFieldBySlug(companyContactSlug(name), field, value);
}
function updateCompanyContactFieldBySlug(slug, field, value){
  const existing = state.companyContacts[slug] || {contactName:'', contactEmail:'', status:'', notes:'', ceoOverride:'', careersUrlOverride:'', linkedinUrlOverride:'', positionOverride:'', unsolicited:null};
  existing[field] = value;
  state.companyContacts[slug] = existing;
  saveCompanyContacts();
}

async function generateUnsolicitedApplication(slug){

  const chosenLang = (state.ui.unsolicitedLang && state.ui.unsolicitedLang[slug]) || state.uiLang;
  const lang = chosenLang === 'fr' ? 'fr' : 'en';
  const langLabel = lang === 'fr' ? 'French' : 'English';
  const industry = lang==='fr' ? company.industryFr : company.industryEn;
  const T = lang === 'fr'
    ? { summary:'RÉSUMÉ PROFESSIONNEL', experience:'EXPÉRIENCE PROFESSIONNELLE', education:'FORMATION', skills:'COMPÉTENCES', certifications:'CERTIFICATIONS', languages:'LANGUES', closing:'"Cordialement," (or another standard formal French closing)' }
    : { summary:'PROFESSIONAL SUMMARY', experience:'EXPERIENCE', education:'EDUCATION', skills:'SKILLS', certifications:'CERTIFICATIONS', languages:'LANGUAGES', closing:'"Sincerely,"' };
  const mobilityLabel = lang === 'fr' ? 'Mobilité géographique' : 'Geographically mobile';
  const mobilityCvInstruction = state.profile.geographicallyMobile
    ? ` Also add "${mobilityLabel}${state.profile.mobilityNote ? ' — ' + state.profile.mobilityNote : ''}" as a short additional item on the contact line (after the LinkedIn/portfolio part), since the candidate has explicitly indicated they're open to relocating.`
    : '';
  const mobilityCoverLetterInstruction = state.profile.geographicallyMobile
    ? ` Since the candidate has indicated they're open to relocating${state.profile.mobilityNote ? ' (' + state.profile.mobilityNote + ')' : ''}, naturally mention this openness to relocate once, briefly, wherever it fits the letter's flow — do not force it if it would read oddly.`
    : '';
  const mobilityEmailInstruction = state.profile.geographicallyMobile
    ? ` If it fits naturally, briefly mention the candidate is open to relocating${state.profile.mobilityNote ? ' (' + state.profile.mobilityNote + ')' : ''} — only a short mention, not a focal point.`
    : '';

  // The candidate can type their own target job title in the Companies table (contact.positionOverride).
  // When they have, we use it verbatim instead of asking the AI to invent a logistics-flavored title,
  // and relax the logistics-only framing used elsewhere in the prompt accordingly.
  const customPosition = (contact.positionOverride || '').trim();
  const roleIntro = customPosition
    ? `to be considered for the specific role of "${customPosition}"`
    : `to be considered for a LOGISTICS-related role`;
  const positionTitleInstruction = customPosition
    ? `the exact job title "${customPosition}" — written in ${langLabel}; translate it naturally into ${langLabel} only if the candidate typed it in a different language, otherwise use it exactly as given. Never leave this blank.`
    : `a specific, realistic LOGISTICS/SUPPLY-CHAIN job title to target at this company — e.g. Logistics Coordinator, Supply Chain Analyst, Warehouse Operations Manager, Distribution Manager, Procurement & Logistics Specialist, Transportation Coordinator — pick whichever one best fits BOTH the candidate's real background below AND this company's industry/operations. Written in ${langLabel} (e.g. \"Coordonnateur(trice) logistique\" in French). Never leave this blank.`;
  const resumeFocusPhrase = customPosition ? 'the targeted position_title role above' : 'the logistics-related position_title above';
  const summaryFocusPhrase = customPosition ? 'the targeted position_title role' : 'logistics/supply-chain work';
  const experienceFocusPhrase = customPosition ? 'the targeted position_title role' : 'logistics, operations, coordination, or supply chain';
  const skillsFocusPhrase = customPosition ? 'the targeted role' : 'logistics/supply-chain';
  const lengthRuleFallback = customPosition
    ? `if the candidate's real background doesn't closely match "${customPosition}", position their genuinely transferable skills toward the role instead of fabricating experience they don't have`
    : `if the candidate's real background has no logistics experience, position their transferable skills (organization, coordination, process, data, operations) toward the role instead of fabricating logistics-specific history`;
  const coverLetterFocusPhrase = customPosition ? `that "${customPosition}" position` : 'that logistics-related position';

  const prompt = `You are an expert resume writer and career coach helping a candidate send a SPONTANEOUS, UNSOLICITED application to a company that has no specific job posting open — they are reaching out proactively ${roleIntro}. Using the candidate profile and company information below, produce a JSON object only (no markdown fences, no preamble) with these exact keys, every piece of prose written ENTIRELY in ${langLabel}:
{
  "position_title": ${JSON.stringify(positionTitleInstruction)},
  "resume": "the resume as plain text, written ENTIRELY in ${langLabel}, following EXACTLY the template below — tailored toward ${resumeFocusPhrase}, grounded only in the candidate's real stated background",
  "cover_letter": "the cover letter body as plain text, written ENTIRELY in ${langLabel}, following EXACTLY the instructions below",
  "email_subject": "a short, professional email subject line (under 12 words) for this spontaneous outreach, in ${langLabel}, naming the position_title",
  "email_body": "a short outreach email (120-180 words) in ${langLabel}: opens with a greeting to the named contact (or a generic professional greeting if no name is given), states this is an unsolicited/spontaneous application for the position_title role, briefly says why the candidate is interested in this specific company, mentions the attached resume and cover letter, and closes politely with the candidate's full name. Plain text, no markdown.${mobilityEmailInstruction}"
}

RESUME TEMPLATE — the STRUCTURE below (line order, pipe " | " separators, and "• " bullet markers) must be reproduced exactly, but every word of actual content — including the section header labels themselves — must be written in ${langLabel}. Omit a line only if genuinely no data exists for it:

<City, Country | email | phone | LinkedIn/portfolio — use the candidate's real contact info exactly as given in the profile below; omit a part only if genuinely blank>${mobilityCvInstruction}

${T.summary}
<2-3 sentence summary written in ${langLabel}, in the FIRST PERSON SINGULAR, that explicitly names the targeted position_title (e.g. "Logistics Coordinator seeking to bring...") and connects the candidate's real experience to ${summaryFocusPhrase} and this company's industry>

${T.experience}
<Job Title | Company | Start–End>

• <achievement bullet>
<Job Title | Company | Start–End>

${T.education}

${T.certifications}

${T.languages}

  try{

// Files a generated spontaneous application directly into the Applications tracker, organized
// into its own "folder" (grouped section) keyed by company name — there's exactly one such
// entry per company, so regenerating updates it in place rather than creating a duplicate.
function upsertUnsolicitedApplication(company, doc){
  const contact = getCompanyContact(company.name);
  const existing = state.applications.find(a => a.isUnsolicited && (a.company||'').trim().toLowerCase() === company.name.trim().toLowerCase());
  if(existing){
    existing.title = doc.title || t('unsolicitedApplicationTitle');
    existing.resume = doc.resume;
    existing.coverLetter = doc.coverLetter;
    existing.emailSubject = doc.emailSubject;
    existing.emailBody = doc.emailBody;
    existing.lang = doc.lang;
    existing.hrName = contact.ceoOverride || company.ceo || '';
    existing.hrEmail = contact.contactEmail || '';
    saveApplications();
    return existing;
  }
  const app = {
    id: uid(),
    title: doc.title || t('unsolicitedApplicationTitle'),
    company: company.name,
    companyAddress: company.hq || '',
    url: contact.careersUrlOverride || company.careersUrl || '',
    jobDesc: '',
    lang: doc.lang,
    resume: doc.resume,
    coverLetter: doc.coverLetter,
    emailSubject: doc.emailSubject,
    emailBody: doc.emailBody,
    compatibilityScore: null,
    compatibilityReasoning: '',
    jobClassification: null,
    salary: null,
    hrName: contact.ceoOverride || company.ceo || '', hrEmail: contact.contactEmail || '', hrPhone: '',
    dateOfApplication: '', followUpDate: '', followUpNotes: '',
    analysisId: null,
    isUnsolicited: true,
    stage: 'tailored',
    appliedAt: null,
    interviewComponents: [], practiceQuestions: [], questionsForEmployer: [],
    createdAt: Date.now()
  };
  state.applications.unshift(app);
  saveApplications();
  return app;
}

async function generateLanguagesAssessment(){
  const p = state.profile;
  if(!p.languages || !p.languages.length){
    state.ui.languagesError = t('errAddLanguagesFirst');
    render(); return;
  }
  state.ui.languagesLoading = true; state.ui.languagesError = "";
  render();

  const genLang = state.ui.languagesGenLang || state.uiLang || 'en';
  const genLangName = genLang === 'fr' ? 'French' : 'English';
  const ratings = state.languagesAssessment.ratings || {};
  const ratingsText = p.languages.map(l => `${l}${ratings[l] ? ` (self-rated ${ratings[l]}/5)` : ''}`).join(', ');

  const prompt = `You are a language-learning coach. The candidate has listed these languages on their profile: ${ratingsText}. For EACH language listed, assess it and give concrete guidance for improving it, including a short level-assessment quiz. Every string value must be written in ${genLangName} EXCEPT the quiz questions/options/vocabulary themselves, which must be written IN the language being tested/taught (e.g. the French quiz is written in French, the Spanish vocabulary is in Spanish) — explanations and translations stay in ${genLangName} so the candidate can understand them.

For free resources, ONLY recommend real, well-established platforms you're confident actually exist and are free (e.g. Duolingo, BBC Languages, Coursera/edX free audit courses, YouTube channels from established language teachers, Tandem or HelloTalk for exchange, Anki for flashcards, TV5Monde or RFI Savoirs for French, Deutsche Welle for German, government-run free resources) — never invent a URL or platform you're not confident is real. If unsure of an exact URL, give the platform's well-known homepage URL rather than guessing a deep link.

Respond with a JSON object only (no markdown fences, no preamble):
{
  "per_language": [
    {
      "language": "the exact language name as listed by the candidate",
      "level_summary": "2-3 sentences assessing their likely current level and what to focus on next, based on how they described this language and its self-rating if given",
      "grammar": ["3-5 specific grammar rules or common mistakes a learner at this level in this language should focus on — concrete and specific, not generic 'practice more'"],
      "vocabulary": [{"word": "a useful word or short phrase IN the target language", "translation": "its translation, written in ${genLangName}", "example": "a short example sentence using it, IN the target language"}] — 8 to 12 words/phrases, weighted toward professional/career vocabulary relevant to the candidate's field where it fits naturally, mixed with everyday useful terms,
      "conjugation": ["3-5 specific verb conjugation patterns or rules this learner should master next — name real verbs/tenses, not generic advice; skip this array entirely (return []) for languages that don't meaningfully conjugate verbs (e.g. Mandarin)"],
      "resources": [{"name": "platform or resource name", "url": "the real homepage URL of this resource", "description": "one sentence on what to use it for and why it fits this language/level"}] — 3-5 free resources,
      "quiz": [{"question": "a question testing vocabulary, grammar, or conjugation, WRITTEN IN the target language", "options": ["4 answer options, WRITTEN IN the target language"], "correct_index": 0, "explanation": "one sentence explaining the correct answer, written in ${genLangName}"}] — exactly 8 questions, ordered from easier to harder, mixing vocabulary/grammar/conjugation, calibrated around their stated or self-rated level so the results can meaningfully distinguish A1 through C1
    }
  ],
  "overall_tips": ["3-5 general language-learning tips that apply across all their languages — habits, study techniques, how to practice consistently"]
}

CANDIDATE'S LANGUAGES: ${ratingsText}

CANDIDATE BACKGROUND (for context — e.g. their field, whether they need a language for career reasons):
${buildProfileText()}`;

  try{
    // Each language needs its own grammar/vocabulary/conjugation/resources/8-question quiz — a
    // fixed budget that's plenty for one language runs out fast with three or four, causing the
    // response to get cut off mid-JSON. Scale with how many languages are actually being covered.
    // The model spends a meaningful chunk of this budget on internal "thinking" before it
    // writes the actual JSON — confirmed via a live response showing ~4,800 thinking tokens
    // out of a 10,500 ceiling for 3 languages, which is what caused the previous cutoff.
    // Thinking tokens count against the same max_tokens limit, so the ceiling needs enough
    // room for BOTH that overhead and the full multi-language JSON content. Raising this
    // doesn't cost more unless the model actually uses the extra room — it only prevents
    // getting cut off early.
    const languagesMaxTokens = Math.min(10000 + p.languages.length * 6000, 32000);
    const raw = await callClaude(prompt, "You always respond with a single valid JSON object and nothing else. Never invent a URL you're not confident is real.", languagesMaxTokens);
    const parsed = JSON.parse(stripFences(raw));
    state.languagesAssessment.perLanguage = (parsed.per_language || []).map(pl => ({
      ...pl,
      quiz: { questions: pl.quiz || [], userAnswers: new Array((pl.quiz||[]).length).fill(null), submitted: false, score: null, level: null }
    }));
    state.languagesAssessment.overallTips = parsed.overall_tips || [];
    state.languagesAssessment.generatedAt = Date.now();
    state.languagesAssessment.genLang = genLang;
    await saveLanguagesAssessment();
  }catch(e){
    // Include the real error when we have one (e.g. Anthropic's own message, or a JSON
    // parsing failure) rather than only the generic message — this is a large, multi-language
    // response and knowing exactly why it failed matters for fixing it.
    state.ui.languagesError = t('errCouldntGenerateThis') + (e && e.message ? ' (' + e.message + ')' : '');
  }
  state.ui.languagesLoading = false;
  render();
}

function cefrLevelFromScore(pct){
  if(pct >= 90) return 'C1/C2';
  if(pct >= 70) return 'B2';
  if(pct >= 50) return 'B1';
  if(pct >= 30) return 'A2';
  return 'A1';
}

function selectQuizAnswer(language, qIndex, optionIndex){
  const pl = state.languagesAssessment.perLanguage.find(x=>x.language===language);
  if(!pl || !pl.quiz || pl.quiz.submitted) return;
  pl.quiz.userAnswers[qIndex] = optionIndex;
  render();
}

function submitLanguageQuiz(language){
  const pl = state.languagesAssessment.perLanguage.find(x=>x.language===language);
  if(!pl || !pl.quiz) return;
  const questions = pl.quiz.questions || [];
  const answers = pl.quiz.userAnswers || [];
  let correct = 0;
  questions.forEach((q,i)=>{ if(answers[i] === (q.correct_index ?? q.correctIndex)) correct++; });
  const pct = questions.length ? Math.round((correct / questions.length) * 100) : 0;
  pl.quiz.submitted = true;
  pl.quiz.score = pct;
  pl.quiz.level = cefrLevelFromScore(pct);
  saveLanguagesAssessment();
  render();
}

function retakeLanguageQuiz(language){
  const pl = state.languagesAssessment.perLanguage.find(x=>x.language===language);
  if(!pl || !pl.quiz) return;
  pl.quiz.userAnswers = new Array((pl.quiz.questions||[]).length).fill(null);
  pl.quiz.submitted = false;
  pl.quiz.score = null;
  pl.quiz.level = null;
  saveLanguagesAssessment();
  render();
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result); // a data: URL, e.g. "data:application/pdf;base64,...."
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Saves the original uploaded file itself (not just extracted text) so it can be re-downloaded
// later, via Firebase Storage. The 25MB cap below is a sane app-level choice, not a technical
// workaround — Storage itself supports far larger files — with a clear message explaining why
// a file was skipped, rather than failing silently.
async function saveSelfDiscoveryDocFile(file){
  const MAX_BYTES = 25 * 1024 * 1024; // a sane app-level cap, not a workaround — Storage itself supports far larger files
  if(file.size > MAX_BYTES){
    return { saved:false, reason:'too_large' };

// Accepts multiple files at once (PDF, DOCX, or images) purely for safekeeping — no content
// extraction happens here, unlike the bilan-de-compétences importer above. Same per-file
// storage architecture and size cap as that feature, for the same reasons.
async function handlePersonalFilesVaultUpload(e){
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  const allowedExt = ['.pdf','.docx','.png','.jpg','.jpeg','.gif','.webp'];
  state.ui.vaultError = ""; state.ui.vaultNote = "";
  state.ui.vaultLoading = true;
  render();

  let savedCount = 0, skippedTooLarge = [], skippedType = [];
  for(const file of files){
    const name = file.name.toLowerCase();
    if(!allowedExt.some(ext => name.endsWith(ext))){
      skippedType.push(file.name);
      continue;
    }
    const result = await saveSelfDiscoveryDocFileGeneric(file, 'personalFilesVault', state.personalFilesVault, savePersonalFilesVaultIndex);
    if(result.saved) savedCount++;
    else if(result.reason === 'too_large') skippedTooLarge.push(file.name);
  }

  const notes = [];
  if(savedCount) notes.push(`${savedCount} ${savedCount===1?t('fileWordSingular'):t('fileWordPlural')} ${t('savedWord')}`);
  if(skippedTooLarge.length) notes.push(`${t('toastDocTooLargeToSave')} (${skippedTooLarge.join(', ')})`);
  if(skippedType.length) notes.push(`${t('toastUnsupportedFileType')} (${skippedType.join(', ')})`);
  state.ui.vaultNote = notes.join(' · ');
  state.ui.vaultLoading = false;
  render();
}

// Shared save logic used by both the bilan-de-compétences file save and the general vault,
// since they follow the identical storage pattern. `category` namespaces the two libraries
// within Storage (e.g. "personalFilesVault/abc123") so their files can never collide even
// though each library generates its own IDs independently.
async function saveSelfDiscoveryDocFileGeneric(file, category, targetArray, saveIndexFn){
  const MAX_BYTES = 25 * 1024 * 1024;
  if(file.size > MAX_BYTES) return { saved:false, reason:'too_large' };
  try{
    const dataUrl = await fileToBase64(file);
    const id = uid();
    await window.firebaseUploadFile(state.currentUser.username, category+'/'+id, dataUrl);
    targetArray.unshift({ id, fileName: file.name, mimeType: file.type || '', sizeBytes: file.size, uploadedAt: Date.now() });
    await saveIndexFn();
    return { saved:true, id };
  }catch(e){
    return { saved:false, reason:'error' };
  }
}

async function autoFillSelfDiscovery(forceAll){
  const sr = state.selfReflection;
  const allFieldKeys = ['strengths','weaknesses','values','thingsToChange','thingsToLearn','personalityNotes','lifestylePreferences'];
  const emptyFields = {
    strengths: sr.strengths.length === 0,
    weaknesses: sr.weaknesses.length === 0,
    values: sr.values.length === 0,
    thingsToChange: !sr.thingsToChange,
    thingsToLearn: !sr.thingsToLearn,
    personalityNotes: !sr.personalityNotes,
    lifestylePreferences: !sr.lifestylePreferences
  };
  const fieldsToFill = forceAll ? allFieldKeys : allFieldKeys.filter(k=>emptyFields[k]);
  if(!forceAll && fieldsToFill.length === 0){
    toast(t('toastAutofillNothingToFill'));
    return;
  }

  state.ui.autofillLoading = true; state.ui.autofillError = "";
  render();

  const genLang = state.ui.autofillGenLang || state.uiLang || 'en';
  const genLangName = genLang === 'fr' ? 'French' : 'English';
  const scopeNote = forceAll
    ? 'Produce fresh values for ALL of the fields below, replacing whatever the candidate may already have — this is an explicit regenerate request.'
    : `Only produce values for these specific fields, since the others are already filled in by the candidate: ${fieldsToFill.join(', ')}.`;
  const prompt = `You are a thoughtful career coach inferring self-reflection details from a candidate's real professional background — not inventing anything ungrounded, but making reasonable, honest inferences a good coach would draw from their actual experience, accomplishments, and career trajectory. ${scopeNote} Every value in your response — every field, no exceptions — must be written ENTIRELY in ${genLangName}, regardless of what language the candidate's background below happens to be written in.

Respond with a JSON object only (no markdown fences, no preamble), including ONLY the keys listed above from this set:
{
  "strengths": ["4-6 genuine strengths inferable from their real accomplishments and experience — specific, not generic. Written ENTIRELY in ${genLangName}."],
  "weaknesses": ["3-5 honest, constructive growth areas a thoughtful coach might infer from gaps or patterns in their background — framed usefully, not harshly. Written ENTIRELY in ${genLangName}."],
  "values": ["3-5 things that seem to matter to them, inferred from their career choices and the language they use about their work. Written ENTIRELY in ${genLangName}."],
  "thingsToChange": "2-3 sentences on what they might realistically want to change about their work life, inferred from patterns in their background (e.g. frequent job changes, a stated career goal that contrasts with their current path). Written ENTIRELY in ${genLangName}.",
  "thingsToLearn": "2-3 sentences on skills or areas worth developing next, inferred from gaps between their current profile and their stated career goals. Written ENTIRELY in ${genLangName}.",
  "personalityNotes": "2-3 sentences on likely working style and personality, inferred from how they describe their work and achievements. Written ENTIRELY in ${genLangName}.",
  "lifestylePreferences": "2-3 sentences on likely lifestyle preferences (e.g. remote vs. in-office, pace, travel), only if there's real signal for this in their background — otherwise keep it brief and hedge appropriately. Written ENTIRELY in ${genLangName}."
}
Reminder: every field above — strengths, weaknesses, values, and every paragraph — must be written entirely in ${genLangName}, never left in English (or any other language) when ${genLangName} was requested.

CANDIDATE BACKGROUND:
${buildProfileText()}`;

  try{
    const raw = await callClaude(prompt, "You always respond with a single valid JSON object and nothing else.", 2000);
    const parsed = JSON.parse(stripFences(raw));
    const shouldApply = (field) => forceAll || emptyFields[field];
    if(shouldApply('strengths') && parsed.strengths) sr.strengths = parsed.strengths;
    if(shouldApply('weaknesses') && parsed.weaknesses) sr.weaknesses = parsed.weaknesses;
    if(shouldApply('values') && parsed.values) sr.values = parsed.values;
    if(shouldApply('thingsToChange') && parsed.thingsToChange) sr.thingsToChange = parsed.thingsToChange;
    if(shouldApply('thingsToLearn') && parsed.thingsToLearn) sr.thingsToLearn = parsed.thingsToLearn;
    if(shouldApply('personalityNotes') && parsed.personalityNotes) sr.personalityNotes = parsed.personalityNotes;
    if(shouldApply('lifestylePreferences') && parsed.lifestylePreferences) sr.lifestylePreferences = parsed.lifestylePreferences;
    await saveReflection();
    toast(forceAll ? t('toastRegenerateDiscoveryDone') : t('toastAutofillDone'));
  }catch(e){
    state.ui.autofillError = t('toastAutofillFailed');
  }
  state.ui.autofillLoading = false;
  render();
}

async function processSelfDiscoveryDocText(text, fileName){
  try{
    const genLang = state.ui.discoveryDocGenLang || state.uiLang || 'en';
    const genLangName = genLang === 'fr' ? 'French' : 'English';
    const prompt = `Read this document about a person's professional background — it could be a formal skills assessment ("bilan de compétences"), career evaluation, CV, transcript, certificate, or similar. Extract everything genuinely useful for their self-discovery profile: their strengths, growth areas, values, and any insight into what they might want to change or learn, their working style, and lifestyle preferences. Only include what's genuinely evidenced or stated in the text — do not invent anything. Every value in your response must be written ENTIRELY in ${genLangName}, regardless of what language the source document is actually written in.

Respond with a JSON object only (no markdown fences, no preamble):
{
  "strengths": ["short phrases naming genuine strengths this document demonstrates or states outright — omit if none found. Written ENTIRELY in ${genLangName}."],
  "weaknesses": ["short phrases naming growth areas, gaps, or development needs the document states or implies — omit if none found. Written ENTIRELY in ${genLangName}."],
  "values": ["short phrases naming things the document says or shows this person values or prioritizes — omit if none found. Written ENTIRELY in ${genLangName}."],
  "thingsToChange": "1-2 sentences on anything the document suggests they might want to change about their work life — empty string if nothing found. Written ENTIRELY in ${genLangName}.",
  "thingsToLearn": "1-2 sentences on skills or areas the document suggests are worth developing next — empty string if nothing found. Written ENTIRELY in ${genLangName}.",
  "personalityNotes": "1-2 sentences on working style or personality the document reveals — empty string if nothing found. Written ENTIRELY in ${genLangName}.",
  "lifestylePreferences": "1-2 sentences on lifestyle preferences the document reveals (e.g. remote vs. in-office, pace, travel) — empty string if nothing found. Written ENTIRELY in ${genLangName}."
}
Reminder: every field above must be written entirely in ${genLangName} — translate anything from the source document that isn't already in that language, never leave extracted text in its original language when a different one was requested.

DOCUMENT TEXT:
${text}`;
    const raw = await callClaude(prompt, "You always respond with a single valid JSON object and nothing else.", 3000);
    const parsed = JSON.parse(stripFences(raw));

    const sr = state.selfReflection;
    const newStrengths = (parsed.strengths||[]).filter(s => typeof s === 'string' && s.trim() && !sr.strengths.some(existing => existing.toLowerCase() === s.trim().toLowerCase()));
    sr.strengths.push(...newStrengths.map(s=>s.trim()));
    const newWeaknesses = (parsed.weaknesses||[]).filter(s => typeof s === 'string' && s.trim() && !sr.weaknesses.some(existing => existing.toLowerCase() === s.trim().toLowerCase()));
    sr.weaknesses.push(...newWeaknesses.map(s=>s.trim()));
    const newValues = (parsed.values||[]).filter(s => typeof s === 'string' && s.trim() && !sr.values.some(existing => existing.toLowerCase() === s.trim().toLowerCase()));
    sr.values.push(...newValues.map(s=>s.trim()));

    // Paragraph fields: append with a line break if something's already there, so nothing
    // written before is ever lost, rather than being silently overwritten.
    ['thingsToChange','thingsToLearn','personalityNotes','lifestylePreferences'].forEach(field=>{
      const addition = (parsed[field]||'').trim();
      if(!addition) return;
      sr[field] = sr[field] ? sr[field] + '\n\n' + addition : addition;
    });

    await saveReflection();

    const addedCount = newStrengths.length + newWeaknesses.length + newValues.length;
    state.ui.discoveryDocNote = `${t('toastDiscoveryDocDone')} ${fileName} (${addedCount} ${addedCount===1?'item':'items'}).`;
  }catch(e){
    state.ui.discoveryDocError = t('toastDiscoveryDocFailed');
  }
  state.ui.discoveryDocLoading = false;
  render();
}

const MAX_CHAT_ATTACHMENT_BYTES = 10 * 1024 * 1024; // 10 MB

function readFileAsBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]); // strip the "data:...;base64," prefix
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Images are sent to the AI Assistant as real image content (Claude reads them
// natively). Documents are read as plain text using the same extraction the
// app already uses for CV imports (mammoth for .docx, pdf.js for .pdf) —
// consistent with how every other file-reading feature in the app works,
// rather than sending raw document bytes.
async function handleChatFileSelect(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  state.ui.chatAttachError = "";
  for(const file of files){
    if(file.size > MAX_CHAT_ATTACHMENT_BYTES){
      state.ui.chatAttachError = t('errFileTooLarge');
      render();
      continue;
    }
    const lowerName = file.name.toLowerCase();
    state.ui.chatAttachLoading = true;
    render();
    try{
      if(file.type.startsWith('image/')){
        const base64 = await readFileAsBase64(file);
        state.ui.chatAttachments.push({ kind:'image', name: file.name, mediaType: file.type, data: base64 });
      }else if(lowerName.endsWith('.pdf')){
        const text = await extractTextFromPdfFile(file);
        state.ui.chatAttachments.push({ kind:'document', name: file.name, text });
      }else if(lowerName.endsWith('.docx')){
        const text = await extractTextFromDocxFile(file);
        state.ui.chatAttachments.push({ kind:'document', name: file.name, text });
      }else{
        state.ui.chatAttachError = t('errUnsupportedFileType');
      }
    }catch(e){
      state.ui.chatAttachError = t('errCouldntReadAttachment');
    }
    state.ui.chatAttachLoading = false;
    render();
  }
}

function removeChatAttachment(index){
  state.ui.chatAttachments.splice(index, 1);
  render();
}

async function sendChatMessage(){
  const openId = state.ui.openChatId;
  let convo = state.chatConversations.find(c=>c.id===openId);
  const input = document.getElementById('chat-input');
  const text = input ? input.value.trim() : '';
  const attachments = state.ui.chatAttachments;
  if((!text && !attachments.length) || state.ui.chatLoading) return;

  // Sending from the "no conversation open yet" composer starts a new unfiled conversation.
  if(!convo){
    convo = { id: uid(), folderId: null, title: '', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
    state.chatConversations.unshift(convo);
    state.ui.openChatId = convo.id;
  }

  // Only lightweight metadata (name/kind) is kept in the saved message — the
  // actual image bytes are sent to the AI for this turn but not persisted,
  // to keep conversation storage light. The assistant's reply already
  // captures whatever it took away from looking at the image.
  const attachmentMeta = attachments.map(a => ({ kind: a.kind, name: a.name }));
  convo.messages.push({ role:'user', content:text, attachments: attachmentMeta, timestamp:Date.now() });
  if(!convo.title) convo.title = text.slice(0, 60) || (attachments[0] && attachments[0].name) || '';
  convo.updatedAt = Date.now();
  state.ui.chatDraft = '';
  state.ui.chatLoading = true;
  state.ui.chatError = '';
  saveChatData();
  render();

  // Keep the last several exchanges for context without letting the prompt grow unbounded.
  const recentHistory = convo.messages.slice(-21, -1);
  const historyText = recentHistory.length
    ? recentHistory.map(m => (m.role==='user' ? 'Candidate' : 'Coach') + ': ' + m.content).join('\n\n')
    : '(this is the start of the conversation)';

  const cp = state.careerPath;
  const sa = state.skillsAssessment;
  const contextParts = [buildProfileText()];
  if(state.selfReflection && (state.selfReflection.strengths.length || state.selfReflection.values.length)) contextParts.push('SELF-REFLECTION:\n' + buildReflectionText());
  if(cp.narrative) contextParts.push('CAREER PATH NOTES:\n' + cp.narrative);
  if(sa.summary) contextParts.push('SKILLS ASSESSMENT SUMMARY:\n' + sa.summary);

  const documentTexts = attachments.filter(a=>a.kind==='document').map(a=>`--- Attached document: ${a.name} ---\n${a.text}`).join('\n\n');

  const promptText = `You are a warm, direct, knowledgeable career coach in an ongoing conversation with this specific candidate. Use their real background below when it's relevant to what they're asking, but you can also discuss general career and job-search topics that aren't tied to their profile. Reply in the same language the candidate just wrote in, regardless of what language earlier turns were in. Keep answers conversational and reasonably concise unless they clearly want depth. Never invent facts about their background that aren't given below. If the candidate attached an image, look at it carefully and address it directly in your reply.

CANDIDATE CONTEXT:
${contextParts.join('\n\n')}
${documentTexts ? '\n' + documentTexts + '\n' : ''}
CONVERSATION SO FAR:
${historyText}

Candidate: ${text || '(see attached file)'}

Respond as the Coach, addressing only their latest message above.`;

  const imageBlocks = attachments.filter(a=>a.kind==='image').map(a=>({
    type: 'image',
    source: { type: 'base64', media_type: a.mediaType, data: a.data }
  }));
  const content = imageBlocks.length ? [...imageBlocks, { type: 'text', text: promptText }] : promptText;

  try{
    const reply = await callClaude(content);
    convo.messages.push({ role:'assistant', content: reply.trim(), timestamp:Date.now() });
    convo.updatedAt = Date.now();
    saveChatData();
  }catch(e){
    state.ui.chatError = t('errCouldntGetResponse');
  }
  state.ui.chatAttachments = [];
  state.ui.chatLoading = false;
  render();
  const list = document.getElementById('chat-message-list');
  if(list) list.scrollTop = list.scrollHeight;
}

// Pulls a full CV/cover-letter rewrite out of the assistant's raw reply, if
// it included one, and returns the remaining conversational text separately
// — so the chat bubble shows a friendly message while the actual suggested
// document text is kept aside for the Apply buttons to use.
function extractAssistantSuggestion(raw){
  const cvMatch = raw.match(/<<<CV_START>>>([\s\S]*?)<<<CV_END>>>/);
  const clMatch = raw.match(/<<<COVER_LETTER_START>>>([\s\S]*?)<<<COVER_LETTER_END>>>/);
  const display = raw
    .replace(/<<<CV_START>>>[\s\S]*?<<<CV_END>>>/, '')
    .replace(/<<<COVER_LETTER_START>>>[\s\S]*?<<<COVER_LETTER_END>>>/, '')
    .trim();
  return {
    display: display || ((cvMatch || clMatch) ? t('toastAppliedPending') : raw.trim()),
    suggestedCv: cvMatch ? cvMatch[1].trim() : null,
    suggestedCoverLetter: clMatch ? clMatch[1].trim() : null
  };
}

// ---------- Reusable per-page AI Assistant ----------
// A single generic chat engine embedded on each data-heavy page, letting the
// candidate ask for changes to that page's own data in plain language. Each
// page defines a small config (what data to show the AI, the JSON shape it
// may propose changing, and how to actually write an accepted change back
// into state) — the chat UI, prompt building, and response parsing are
// shared. Deliberately NOT added to Sites d'emploi et agences, since that
// page stores actual saved passwords — those are never sent to the AI, and
// the AI is never allowed to set credential values.
function extractDataUpdate(raw){
  const match = raw.match(/<<<DATA_UPDATE>>>([\s\S]*?)<<<DATA_UPDATE_END>>>/);
  const display = raw.replace(/<<<DATA_UPDATE>>>[\s\S]*?<<<DATA_UPDATE_END>>>/, '').trim();
  let update = null;
  if(match){
    try{ update = JSON.parse(stripFences(match[1].trim())); }catch(e){ update = null; }
  }
  return { display: display || (update ? t('toastAppliedPending') : raw.trim()), update };
}

async function sendPageAssistantMessage(pageKey){
  const config = PAGE_ASSISTANT_CONFIGS[pageKey];
  if(!config) return;
  if(!state.pageAssistantChats[pageKey]) state.pageAssistantChats[pageKey] = [];
  const chat = state.pageAssistantChats[pageKey];
  const input = document.getElementById('page-assistant-input-' + pageKey);
  const text = input ? input.value.trim() : '';
  if(!text || state.ui.pageAssistantLoading === pageKey) return;

  chat.push({ role:'user', content:text, timestamp:Date.now() });
  if(!state.ui.pageAssistantDraft) state.ui.pageAssistantDraft = {};
  state.ui.pageAssistantDraft[pageKey] = '';
  state.ui.pageAssistantLoading = pageKey;
  state.ui.pageAssistantError = '';
  render();

  const recentHistory = chat.slice(-13, -1);
  const historyText = recentHistory.length
    ? recentHistory.map(m => (m.role==='user' ? 'Candidate' : 'Assistant') + ': ' + m.content).join('\n\n')
    : '(this is the start of the conversation)';

  const prompt = `You are a helpful assistant embedded directly inside one specific tool in a career-planning app, helping the candidate refine the data on THIS page. Reply in the same language the candidate just wrote in.

If — and only if — the candidate's latest message calls for an actual change to this page's data, include a JSON object wrapped in these exact delimiters describing ONLY the fields that should change, matching this shape:
<<<DATA_UPDATE>>>
${config.schemaDoc}
<<<DATA_UPDATE_END>>>

Never invent facts about the candidate's background not already present below. Outside the delimiter block, write a short, conversational reply explaining what you changed and why — or, if no data change was requested, just answer their question directly.

CURRENT DATA ON THIS PAGE:
${config.buildContext()}

CANDIDATE BACKGROUND (for grounding only):
${buildProfileText()}

CONVERSATION SO FAR:
${historyText}

Candidate: ${text}`;

  try{
    const raw = await callClaude(prompt, "You are precise and careful. Follow the delimiter format exactly when proposing a data change, and never fabricate information.", 4000);
    const { display, update } = extractDataUpdate(raw);
    chat.push({ role:'assistant', content: display, update, timestamp:Date.now() });
  }catch(e){
    state.ui.pageAssistantError = t('errCouldntGetResponse');
  }
  state.ui.pageAssistantLoading = null;
  render();
  const list = document.getElementById('page-assistant-message-list-' + pageKey);
  if(list) list.scrollTop = list.scrollHeight;
}

function applyPageAssistantUpdate(pageKey, index){
  const config = PAGE_ASSISTANT_CONFIGS[pageKey];
  const chat = state.pageAssistantChats[pageKey];
  if(!config || !chat || !chat[index] || !chat[index].update) return;
  config.applyUpdate(chat[index].update);
  chat[index].applied = true;
  toast(t('toastDataApplied'));
  render();
}

function bindPageAssistantEvents(pageKey){
  const sendBtn = document.querySelector(`[data-send-page-assistant="${pageKey}"]`);
  if(sendBtn) sendBtn.onclick = ()=> sendPageAssistantMessage(pageKey);
  const input = document.getElementById('page-assistant-input-' + pageKey);
  if(input){
    input.onblur = ()=>{ if(!state.ui.pageAssistantDraft) state.ui.pageAssistantDraft = {}; state.ui.pageAssistantDraft[pageKey] = input.value; };
    input.onkeydown = (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendPageAssistantMessage(pageKey); } };
  }
  document.querySelectorAll(`[data-apply-page-update^="${pageKey}:"]`).forEach(b=>{
    b.onclick = ()=>{
      const idx = +b.dataset.applyPageUpdate.split(':')[1];
      applyPageAssistantUpdate(pageKey, idx);
    };
  });
}

Respond with a JSON object only (no markdown fences, no preamble):
