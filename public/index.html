  }

  const combined = sections.join('\n\n');
  // Deliberately plain text, not JSON: asking for JSON *and* a long document in one response
  // adds overhead and risks the response being cut off before the closing brace, which is what
  // broke this the first time. Plain text has no such failure mode.
  const prompt = `You are an expert resume writer. Below are the extracted texts of ${cvMergeFileObjects.length} different versions of the same person's CV/résumé (old and new, in no guaranteed order). Reconcile them into ONE accurate, complete, polished master CV:
- Merge unique experience, roles, and achievements found in ANY version — don't drop something relevant just because it's only in one version.
- When versions conflict on the same role/detail (e.g. different phrasing of the same bullet, or different contact info), prefer whichever version looks most recent or most complete, and use it.
- Deduplicate entries that are clearly the same thing restated.
- Never invent anything not present in at least one of the source texts below.

Respond with ONLY the merged CV as plain text — no preamble, no explanation, no markdown fences — following EXACTLY this template (keep the pipe " | " separators and bullet "• " markers exactly as shown; omit a line only if genuinely no data exists for it):
<Full Name>
<City, Country | email | phone | LinkedIn/portfolio>

PROFESSIONAL SUMMARY
<2-3 sentence summary>

EXPERIENCE
<Job Title | Company | Start–End>
• <achievement bullet>
<Job Title | Company | Start–End>
• <achievement bullet>

EDUCATION
<Degree | School | Year>

SKILLS
<comma-separated list>

CERTIFICATIONS
<comma-separated list — omit section if none>

LANGUAGES
<comma-separated list — omit section if none>

LENGTH GUIDANCE: this is a master reference CV, so it can run a bit longer than a typical job-tailored 2-page résumé — but it still needs a firm limit so it stays usable. Target 700–950 words total. To hit that: for each role, keep only the 3-5 most impactful bullets (merge near-duplicate bullets from different versions into one strong bullet rather than listing variants separately); do not include every bullet from every source version. Prioritize breadth of roles/education over exhaustive detail within any one role.

SOURCE CV VERSIONS:
${combined}`;
  try{
    const raw = await callClaude(prompt, undefined, 8000);
    m.mergedResume = raw.trim();
  }catch(e){
    m.error = t('errCouldntMergeCvs');
  }
  m.loading = false;
  render();
}

// Real PDF export using jsPDF — lays out the same parsed sections as the on-screen preview.
function buildResumePdfDoc(resumeText){
  const parsed = parseResumeText(resumeText);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const marginX = 54, pageWidth = 612, pageHeight = 792, maxWidth = pageWidth - marginX*2;
  let y = 56;

  const ensureRoom = (needed)=>{
    if(y + needed > pageHeight - 50){ doc.addPage(); y = 56; }
  };
  const writeWrapped = (text, x, fontSize, opts)=>{
    opts = opts || {};
    doc.setFontSize(fontSize);
    doc.setFont('helvetica', opts.bold ? 'bold' : 'normal');
    const lines = doc.splitTextToSize(text, opts.maxWidth || maxWidth);
    lines.forEach(line=>{
      ensureRoom(fontSize*1.4);
      doc.text(line, x, y);
      y += fontSize*1.35;
    });
  };

  doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.text(parsed.name || '', pageWidth/2, y, {align:'center'});
  y += 22;
  if(parsed.contact){
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    doc.setTextColor(90,101,112);
    doc.text(parsed.contact, pageWidth/2, y, {align:'center'});
    doc.setTextColor(22,27,34);
    y += 18;
  }
  doc.setDrawColor(192,138,46); doc.setLineWidth(1.2);
  doc.line(pageWidth/2-40, y, pageWidth/2+40, y);
  y += 20;

  parsed.sections.forEach(sec=>{
    if(sec.type==='paragraph' && !sec.text && !sec.header) return;
    ensureRoom(30);
    if(sec.header){
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
      doc.setTextColor(31,58,95);
      doc.text(sec.header.toUpperCase(), marginX, y);
      doc.setTextColor(22,27,34);
      doc.setDrawColor(192,138,46); doc.setLineWidth(0.75);
      doc.line(marginX, y+4, pageWidth-marginX, y+4);
      y += 18;
    }
    if(sec.type==='paragraph'){
      writeWrapped(sec.text, marginX, 10.5);
    } else if(sec.type==='experience'){
      sec.entries.forEach(ent=>{
        const parts = ent.header.split('|').map(s=>s.trim());
        const headerLine = parts.filter(Boolean).join('  —  ');
        writeWrapped(headerLine, marginX, 11, {bold:true});
        ent.bullets.forEach(b=>{
          writeWrapped('•  '+b, marginX+10, 10);
        });
        y += 4;
      });
    } else if(sec.type==='education'){
      sec.entries.forEach(l=>{
        writeWrapped(l.split('|').map(s=>s.trim()).filter(Boolean).join('  —  '), marginX, 10.5);
      });
    } else if(sec.type==='list'){
      writeWrapped(sec.items.join('  ·  '), marginX, 10);
    }
    y += 8;
  });

  return doc;
}

// Headers are looked up directly by target language — never generated by the AI — so they're
// always exactly correct regardless of translation quality on the actual content.
const DISCOVERY_REPORT_HEADERS = {
  en: { qualities:'QUALITIES', shortcomings:'SHORTCOMINGS', matters:'WHAT MATTERS TO YOU', change:'THINGS YOU WANT TO CHANGE', learn:'THINGS YOU WANT TO LEARN', personality:'PERSONALITY & WORK STYLE', lifestyle:'LIFESTYLE PREFERENCES', currentSalary:'CURRENT SALARY', careerPath:'CAREER PATH', roles:'ROLES WORTH EXPLORING', environments:'ENVIRONMENTS TO LOOK FOR', watchOuts:'WATCH OUT FOR', notSpecified:'Not specified.' },
  fr: { qualities:'QUALITÉS', shortcomings:'POINTS FAIBLES', matters:'CE QUI COMPTE POUR VOUS', change:'CE QUE VOUS VOULEZ CHANGER', learn:'CE QUE VOUS VOULEZ APPRENDRE', personality:'PERSONNALITÉ ET STYLE DE TRAVAIL', lifestyle:'PRÉFÉRENCES DE STYLE DE VIE', currentSalary:'SALAIRE ACTUEL', careerPath:'PARCOURS DE CARRIÈRE', roles:'POSTES À EXPLORER', environments:'ENVIRONNEMENTS À PRIVILÉGIER', watchOuts:'À SURVEILLER', notSpecified:'Non précisé.' }
};

// Builds the Self-Discovery report by translating the raw field VALUES only (as structured
// JSON, which the model handles far more faithfully than an unstructured prose blob), then
// assembling the document with headers looked up directly for the target language.
async function buildTranslatedDiscoveryReport(targetLangCode){
  const sr = state.selfReflection;
  const cp = state.careerPath;
  const H = DISCOVERY_REPORT_HEADERS[targetLangCode] || DISCOVERY_REPORT_HEADERS.en;
  const targetLangName = targetLangCode === 'fr' ? 'French' : 'English';

  const payload = {
    strengths: sr.strengths, weaknesses: sr.weaknesses, values: sr.values,
    thingsToChange: sr.thingsToChange, thingsToLearn: sr.thingsToLearn,
    personalityNotes: sr.personalityNotes, lifestylePreferences: sr.lifestylePreferences,
    currentSalary: sr.currentSalary || '',
    careerNarrative: cp.narrative || '',
    roles: cp.roles.map(r=>({title:r.title, rationale:r.rationale||'', salaryRange:r.salaryRange||''})),
    environments: cp.environments, watchOuts: cp.watchOuts
  };

  let translated = payload;
  const hasContent = Object.values(payload).some(v => Array.isArray(v) ? v.length : !!v);
  if(hasContent){
    const prompt = `Translate every text value in this JSON object into ${targetLangName}. If a value is already entirely in ${targetLangName}, leave it exactly as-is. Keep the exact same JSON structure and keys — translate only the values. Keep proper nouns and tool/technology names (e.g. "SQL") untranslated. Respond with a JSON object only (no markdown fences, no preamble), same shape as the input:

${JSON.stringify(payload, null, 2)}`;
    try{
      const raw = await callClaude(prompt, "You always respond with a single valid JSON object matching the input's structure, and nothing else.", 8000);
      translated = JSON.parse(stripFences(raw));
    }catch(e){
      translated = payload; // fall back to untranslated content rather than fail the whole download
    }
  }

  const blocks = [];
  blocks.push(H.qualities + '\n' + ((translated.strengths||[]).join(', ') || H.notSpecified));
  blocks.push(H.shortcomings + '\n' + ((translated.weaknesses||[]).join(', ') || H.notSpecified));
  blocks.push(H.matters + '\n' + ((translated.values||[]).join(', ') || H.notSpecified));
  blocks.push(H.change + '\n' + (translated.thingsToChange || H.notSpecified));
  blocks.push(H.learn + '\n' + (translated.thingsToLearn || H.notSpecified));
  blocks.push(H.personality + '\n' + (translated.personalityNotes || H.notSpecified));
  blocks.push(H.lifestyle + '\n' + (translated.lifestylePreferences || H.notSpecified));
  if(translated.currentSalary) blocks.push(H.currentSalary + '\n' + translated.currentSalary);
  if(translated.careerNarrative){
    blocks.push(H.careerPath + '\n' + translated.careerNarrative);
    if(translated.roles && translated.roles.length) blocks.push(H.roles + '\n' + translated.roles.map(r=>`${r.title} — ${r.rationale||''}${r.salaryRange ? ' ('+t('salaryRangeLabel')+': '+r.salaryRange+')' : ''}`).join('\n'));
    if(translated.environments && translated.environments.length) blocks.push(H.environments + '\n' + translated.environments.join(', '));
    if(translated.watchOuts && translated.watchOuts.length) blocks.push(H.watchOuts + '\n' + translated.watchOuts.join(', '));
  }
  return blocks.join('\n\n');
}

async function handleSkillsDocUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const name = file.name.toLowerCase();
  state.ui.skillsDocError = ""; state.ui.skillsDocNote = "";
  if(!name.endsWith('.docx') && !name.endsWith('.pdf')){
    state.ui.skillsDocError = t('errPleaseUploadDocxPdf');
    render(); return;
  }
  state.ui.skillsDocLoading = true;
  render();
  try{
    let text = '';
    if(name.endsWith('.docx')) text = await extractTextFromDocxFile(file);
    else text = await extractTextFromPdfFile(file);
    if(!text){ throw new Error('empty'); }

    const prompt = `Read this document about a person's background — it could be a CV, transcript, certificate, project write-up, or a formal career/skills assessment (e.g. a "bilan de compétences"). Pull out everything genuinely useful for both their professional skill list and their self-discovery profile. Respond with a JSON object only (no markdown fences, no preamble):
{
  "skills": ["specific, concrete skills genuinely evidenced in this document — technical, analytical, or professional; 3-12 items"],
  "strengths": ["3-6 short phrases naming genuine personal/professional strengths this document demonstrates or states outright"],
  "values": ["short phrases naming things the document says or shows this person values or prioritizes — e.g. from a values/motivations section — omit if the document doesn't cover this"],
  "developmentAreas": ["short phrases naming areas for growth, gaps, or things to work on if the document states or implies any — e.g. from a development-needs or action-plan section — omit if the document doesn't cover this"]
}
Only include what's genuinely evidenced in the text below — do not invent anything. Respond in the same language as the document.

DOCUMENT TEXT:
${text}`;
    const raw = await callClaude(prompt, "You always respond with a single valid JSON object and nothing else.");
    const parsed = JSON.parse(stripFences(raw));

    const p = state.profile;
    const newSkills = (parsed.skills||[]).filter(s => typeof s === 'string' && s.trim() && !p.skills.some(existing => existing.toLowerCase() === s.trim().toLowerCase()));
    p.skills.push(...newSkills.map(s=>s.trim()));

    const sr = state.selfReflection;
    const newStrengths = (parsed.strengths||[]).filter(s => typeof s === 'string' && s.trim() && !sr.strengths.some(existing => existing.toLowerCase() === s.trim().toLowerCase()));
    sr.strengths.push(...newStrengths.map(s=>s.trim()));
    const newValues = (parsed.values||[]).filter(s => typeof s === 'string' && s.trim() && !sr.values.some(existing => existing.toLowerCase() === s.trim().toLowerCase()));
    sr.values.push(...newValues.map(s=>s.trim()));
    const newWeaknesses = (parsed.developmentAreas||[]).filter(s => typeof s === 'string' && s.trim() && !sr.weaknesses.some(existing => existing.toLowerCase() === s.trim().toLowerCase()));
    sr.weaknesses.push(...newWeaknesses.map(s=>s.trim()));

    await autosaveProfile();
    await saveReflection();

    // Keep a visible, downloadable record of what this specific document contributed.
    state.skillsAssessment.docExtract = {
      fileName: file.name,
      skills: newSkills, strengths: newStrengths, values: newValues, developmentAreas: newWeaknesses,
      extractedAt: Date.now()
    };
    await saveSkillsAssessment();

    const parts = [];
    if(newSkills.length) parts.push(`${newSkills.length} skill${newSkills.length===1?'':'s'}`);
    if(newStrengths.length) parts.push(`${newStrengths.length} strength${newStrengths.length===1?'':'s'}`);
    if(newValues.length) parts.push(`${newValues.length} value${newValues.length===1?'':'s'}`);
    if(newWeaknesses.length) parts.push(`${newWeaknesses.length} development area${newWeaknesses.length===1?'':'s'}`);
    state.ui.skillsDocNote = parts.length ? `Added: ${parts.join(', ')} — see the summary below.` : 'Nothing new found — everything in this document was already captured.';
  }catch(err){
    state.ui.skillsDocError = t('errCouldntReadOrExtract');
  }
  state.ui.skillsDocLoading = false;
  render();
}

const SKILLS_REPORT_HEADERS = {
  en: { ratings:'SELF-RATED SKILLS', summary:'ASSESSMENT SUMMARY', strengths:'GENUINE STRENGTHS', gaps:'GAPS WORTH ADDRESSING', recs:'WORTH DEVELOPING NEXT', fromDoc:'FROM UPLOADED DOCUMENT', skillsLbl:'Skills', strengthsLbl:'Strengths', valuesLbl:'Values', devLbl:'Development areas', noData:'No assessment data yet — rate some skills and generate an assessment first.' },
  fr: { ratings:'COMPÉTENCES AUTO-ÉVALUÉES', summary:"RÉSUMÉ DE L'ÉVALUATION", strengths:'FORCES RÉELLES', gaps:'LACUNES À COMBLER', recs:'À DÉVELOPPER EN PRIORITÉ', fromDoc:'DEPUIS LE DOCUMENT TÉLÉVERSÉ', skillsLbl:'Compétences', strengthsLbl:'Forces', valuesLbl:'Valeurs', devLbl:'Axes de développement', noData:"Aucune donnée d'évaluation pour l'instant — évaluez quelques compétences et générez une évaluation d'abord." }
};

// Skill names themselves (from the ratings) are left untranslated — they're the user's own
// list of real skill/tool names (often proper nouns like "SQL"), so translating them risks
// breaking their correspondence with Background. Only the AI-generated prose is translated.
async function buildTranslatedSkillsAssessmentReport(targetLangCode){
  const sa = state.skillsAssessment;
  const H = SKILLS_REPORT_HEADERS[targetLangCode] || SKILLS_REPORT_HEADERS.en;
  const targetLangName = targetLangCode === 'fr' ? 'French' : 'English';

  const payload = {
    summary: sa.summary || '',
    strengths: sa.strengths || [],
    gaps: sa.gaps || [],
    recommendations: sa.recommendations || [],
    docExtract: sa.docExtract ? {
      strengths: sa.docExtract.strengths || [], values: sa.docExtract.values || [], developmentAreas: sa.docExtract.developmentAreas || []
    } : null
  };

  let translated = payload;
  const hasContent = payload.summary || payload.strengths.length || payload.gaps.length || payload.recommendations.length || (payload.docExtract && Object.values(payload.docExtract).some(v=>v.length));
  if(hasContent){
    const prompt = `Translate every text value in this JSON object into ${targetLangName}. If a value is already entirely in ${targetLangName}, leave it exactly as-is. Keep the exact same JSON structure and keys. Keep proper nouns and tool/technology names untranslated. Respond with a JSON object only (no markdown fences, no preamble), same shape as the input:

${JSON.stringify(payload, null, 2)}`;
    try{
      const raw = await callClaude(prompt, "You always respond with a single valid JSON object matching the input's structure, and nothing else.", 8000);
      translated = JSON.parse(stripFences(raw));
    }catch(e){
      translated = payload; // fall back to untranslated content rather than fail the whole download
    }
  }

  const blocks = [];
  const ratingLines = Object.entries(sa.ratings).filter(([k,v])=>v>0).map(([k,v])=>`${k}: ${v}/5`);
  if(ratingLines.length) blocks.push(H.ratings + '\n' + ratingLines.join('\n'));
  if(translated.summary) blocks.push(H.summary + '\n' + translated.summary);
  if(translated.strengths && translated.strengths.length) blocks.push(H.strengths + '\n' + translated.strengths.join(', '));
  if(translated.gaps && translated.gaps.length) blocks.push(H.gaps + '\n' + translated.gaps.join(', '));
  if(translated.recommendations && translated.recommendations.length) blocks.push(H.recs + '\n' + translated.recommendations.join(', '));
  if(sa.docExtract){
    const d = translated.docExtract || {};
    let docBlock = `${H.fromDoc}: ${sa.docExtract.fileName}\n`;
    if(sa.docExtract.skills && sa.docExtract.skills.length) docBlock += `${H.skillsLbl}: ${sa.docExtract.skills.join(', ')}\n`; // skill names left untranslated
    if(d.strengths && d.strengths.length) docBlock += `${H.strengthsLbl}: ${d.strengths.join(', ')}\n`;
    if(d.values && d.values.length) docBlock += `${H.valuesLbl}: ${d.values.join(', ')}\n`;
    if(d.developmentAreas && d.developmentAreas.length) docBlock += `${H.devLbl}: ${d.developmentAreas.join(', ')}\n`;
    blocks.push(docBlock.trim());
  }
  return blocks.join('\n\n') || H.noData;
}

// Extra guidance injected into the sample-answer prompt specifically for the
// two standard questions above — a real "strengths" or "weaknesses" answer
// should name several, not just one, so this overrides the generic single-
// story format used for every other question.
function extraGuidanceForQuestion(questionText){
  const qualityQuestions = ['Quelles sont vos qualités ?', 'What are your strengths?'];
  const weaknessQuestions = ['Quels sont vos défauts ?', 'What are your weaknesses?'];
  if(qualityQuestions.includes(questionText)) return '\nThis is the "strengths" question — the answer must name at least 3 and up to 5 distinct qualities/strengths (not just one), each briefly grounded in something from the background below.';
  if(weaknessQuestions.includes(questionText)) return '\nThis is the "weaknesses" question — the answer must name at least 3 and up to 5 distinct weaknesses/areas for growth (not just one), each briefly and honestly framed with how the candidate is addressing it.';
  return '';
}

}
Both must be written entirely in ${genLangName}.

${buildAnswerContextText(app)}`;
  try{

Respond with a JSON object only (no markdown fences, no preamble):

const INTERVIEW_REPORT_HEADERS = {
  en: { pitch:'BACKGROUND PITCH', practiceQuestions:'PRACTICE QUESTIONS', sampleAnswer:'Sample answer', yourAnswer:'Your answer', feedback:'Feedback', notAnswered:'(not answered yet)', notGenerated:'(not generated yet)', interviewStage:'INTERVIEW STAGE', nothingGenerated:'Nothing generated yet.', questionsForEmployer:'QUESTIONS TO ASK THEM', keyPoints:'Key points to hit' },
  fr: { pitch:'PRÉSENTATION PERSONNELLE', practiceQuestions:'QUESTIONS DE PRATIQUE', sampleAnswer:'Réponse type', yourAnswer:'Votre réponse', feedback:'Rétroaction', notAnswered:'(pas encore répondu)', notGenerated:'(pas encore généré)', interviewStage:"ÉTAPE D'ENTREVUE", nothingGenerated:'Rien généré pour le moment.', questionsForEmployer:'QUESTIONS À LEUR POSER', keyPoints:'Points clés à retenir' }
};

async function buildTranslatedInterviewReport(app, targetLangCode){
  const H = INTERVIEW_REPORT_HEADERS[targetLangCode] || INTERVIEW_REPORT_HEADERS.en;
  const targetLangName = targetLangCode === 'fr' ? 'French' : 'English';
  const sp = state.interviewSpeech;
  const components = (app && app.interviewComponents) || [];

  const payload = {
    pitch: sp.text || '',
    pitchKeyPoints: sp.keyPoints || [],
    questions: ((app && app.practiceQuestions) || []).map(q=>({category:q.category||'', question:q.question, sampleAnswer:q.sampleAnswer||'', sampleAnswerKeyPoints:q.sampleAnswerKeyPoints||[], userAnswer:q.userAnswer||'', feedback:q.feedback||''})),
    questionsForEmployer: (app && app.questionsForEmployer) || [],
    components: components.map(c=>({name:c.name, talkingPoints:c.talkingPoints||'', keyPoints:c.keyPoints||[]}))
  };

  let translated = payload;
  const hasContent = payload.pitch || payload.questions.length || payload.questionsForEmployer.length || payload.components.length;
  if(hasContent){
    const prompt = `Translate every text value in this JSON object into ${targetLangName}. If a value is already entirely in ${targetLangName}, leave it exactly as-is. Keep the exact same JSON structure and keys — translate only the values, and leave empty strings empty. Keep proper nouns and tool/technology names untranslated. Respond with a JSON object only (no markdown fences, no preamble), same shape as the input:

${JSON.stringify(payload, null, 2)}`;
    try{
      // Larger token budget than the other translation calls — this payload (questions +
      // sample answers + feedback + interview components) is structurally the largest of the
      // three, and running out of room here silently truncates the JSON response.
      const raw = await callClaude(prompt, "You always respond with a single valid JSON object matching the input's structure, and nothing else.", 8000);
      translated = JSON.parse(stripFences(raw));
    }catch(e){
      translated = payload; // fall back to untranslated content rather than fail the whole download
    }
  }

  const blocks = [];
  if(translated.pitch){
    let pitchBlock = markBoldPhrasesPlain(translated.pitch, translated.pitchKeyPoints);
    if(translated.pitchKeyPoints && translated.pitchKeyPoints.length) pitchBlock += `\n\n${H.keyPoints}: ${translated.pitchKeyPoints.join(', ')}`;
    blocks.push(H.pitch + '\n' + pitchBlock);
  }
  if(translated.questions && translated.questions.length){
    const qBlock = translated.questions.map((q,i)=>{
      const answerText = q.sampleAnswer ? markBoldPhrasesPlain(q.sampleAnswer, q.sampleAnswerKeyPoints) : H.notGenerated;
      const keyPointsLine = (q.sampleAnswerKeyPoints && q.sampleAnswerKeyPoints.length) ? `\n${H.keyPoints}: ${q.sampleAnswerKeyPoints.join(', ')}` : '';
      return `${i+1}. [${q.category||''}] ${q.question}\n\n${H.sampleAnswer}: ${answerText}${keyPointsLine}\n\n${H.yourAnswer}: ${q.userAnswer||H.notAnswered}\n\n${H.feedback}: ${q.feedback||H.notGenerated}`;
    }).join('\n\n---\n\n');
    blocks.push(H.practiceQuestions + '\n' + qBlock);
  }
  if(translated.questionsForEmployer && translated.questionsForEmployer.length){
    blocks.push(H.questionsForEmployer + '\n' + translated.questionsForEmployer.map(q=>'• '+q).join('\n'));
  }
  if(translated.components){
    translated.components.forEach(c=>{
      const talkingText = c.talkingPoints ? markBoldPhrasesPlain(c.talkingPoints, c.keyPoints) : H.notGenerated;
      const keyPointsLine = (c.keyPoints && c.keyPoints.length) ? `\n${H.keyPoints}: ${c.keyPoints.join(', ')}` : '';
      blocks.push(`${H.interviewStage}: ${(c.name||'').toUpperCase()}\n` + talkingText + keyPointsLine);
    });
  }
  return blocks.join('\n\n') || H.nothingGenerated;
}

async function downloadInterviewPrepReport(format){
  const u = state.ui;
  const app = state.applications.find(a=>a.id===u.interviewAppId);
  const lang = u.interviewDlLang || state.uiLang || 'en';
  u.interviewDlLoading = true; u.interviewDlError = "";
  render();
  try{
    const report = await buildTranslatedInterviewReport(app, lang);
    const titleBase = lang === 'fr' ? 'Préparation entrevue' : 'Interview Prep';
    const title = titleBase + (app ? ' — ' + app.title + (lang==='fr'?' chez ':' at ') + app.company : '');
    if(format === 'docx') await downloadPlainTextDocx(title, report, 'Interview_Prep.docx');
    else downloadPlainTextPdf(title, report, 'Interview_Prep.pdf');
  }catch(e){
    u.interviewDlError = t('errCouldntPrepareDownload');
  }
  u.interviewDlLoading = false;
  render();
}

async function generateInterviewSpeech(){
  if(!state.profile.name){
    state.ui.speechError = t('errFillBackgroundFirst');
    render(); return;
  }
  const app = state.applications.find(a=>a.id===state.ui.interviewAppId);
  if(!app){
    state.ui.speechError = t('hintSelectAppFirstForPitch');
    render(); return;
  }
  state.ui.speechLoading = true; state.ui.speechError = "";
  render();
  const genLangName = (state.ui.interviewGenLang || state.uiLang || 'en') === 'fr' ? 'French' : 'English';
  const targetContext = `Tailor this specifically to the "${app.title}" role at "${app.company}". Job description for context:\n${app.jobDesc}`;
  const prompt = `You are an interview coach. Write a spoken "tell me about yourself" introduction for this candidate to say out loud in an interview — about 60-90 seconds when spoken aloud (roughly 150-220 words). Use a clear present → past → future structure: who they are professionally now, the relevant experience that got them here, and what they're looking for next. Natural, confident, conversational spoken language — not resume bullet points, no headers, no markdown. First person. Ground everything only in their real background below; do not invent achievements. Write entirely in ${genLangName}.

Respond with a JSON object only (no markdown fences, no preamble):
{
  "pitch": "the spoken introduction, as described above",
  "key_points": ["3-6 short phrases or keywords pulled directly from the pitch text — the essential things to remember and say, useful as a quick glance summary before walking into the interview. Each should be an exact or near-exact phrase that actually appears in the pitch, not a paraphrase."]
}
Both must be written entirely in ${genLangName}.

${targetContext}

CANDIDATE PROFILE:
${buildProfileText()}

CANDIDATE SELF-REFLECTION (use for tone/personality, don't state it directly):
${buildReflectionText()}`;
  try{
    const raw = await callClaude(prompt, "You always respond with a single valid JSON object and nothing else.");
    const parsed = JSON.parse(stripFences(raw));
    state.interviewSpeech = { text: (parsed.pitch||'').trim(), keyPoints: parsed.key_points || [], tailoredForAppId: app ? app.id : null, generatedAt: Date.now(), genLang: state.ui.interviewGenLang || state.uiLang || 'en' };
    saveInterviewSpeech();
  }catch(e){
    state.ui.speechError = t('errCouldntGenerateThis');
  }
  state.ui.speechLoading = false;
  render();
}

// Always included alongside the AI-generated practice questions, regardless
// of whether the model happens to produce something similar on its own —
// these three come up in almost every interview, so they shouldn't depend
// on the AI remembering to include them.
function standardPracticeQuestions(lang){
  return lang === 'fr' ? [
    { category:'Motivation', question:'Quelles sont vos qualités ?' },
    { category:'Motivation', question:'Quels sont vos défauts ?' },
    { category:'Motivation', question:'Pourquoi avez-vous choisi notre entreprise ?' }
  ] : [
    { category:'Motivation', question:'What are your strengths?' },
    { category:'Motivation', question:'What are your weaknesses?' },
    { category:'Motivation', question:'Why did you choose our company?' }
  ];
}

async function generateQuestions(){
  const app = state.applications.find(a=>a.id===state.ui.interviewAppId);
  if(!app) return;
  state.ui.qLoading = true; render();
  const genLangName = (state.ui.interviewGenLang || state.uiLang || 'en') === 'fr' ? 'French' : 'English';
  const prompt = `You are an interview coach. Based on the job description and candidate profile below, produce a JSON object only (no markdown fences, no preamble) with these exact keys:
{
  "practice_questions": [array of 8 realistic interview questions this candidate is likely to be ASKED for this role — a mix of behavioral, role-specific/technical, and motivation questions. Each item: {"category": "Behavioral"|"Technical"|"Motivation", "question": "..."}],
  "questions_for_employer": [array of 6-8 thoughtful questions the CANDIDATE could ask the interviewer, typically near the end of the interview. Cover a genuine mix, not just compensation: include at least one tactfully-phrased question about compensation or how pay/salary range is structured for the role, plus others about growth or promotion path, team structure and day-to-day work, what success looks like in this role, company priorities or culture, and next steps in the hiring process. Each item is just a plain question string, phrased naturally and professionally — the salary one especially should sound tactful, not blunt.]
}
Write every question in ${genLangName} (translate category labels too if applicable).

CANDIDATE PROFILE:
${buildProfileText()}

JOB TITLE: ${app.title}
COMPANY: ${app.company}
JOB DESCRIPTION:
${app.jobDesc}`;
  try{
    const raw = await callClaude(prompt, "You always respond with a single valid JSON object and nothing else.");
    const parsed = JSON.parse(stripFences(raw));
    const genLang = state.ui.interviewGenLang || state.uiLang || 'en';
    const aiQuestions = parsed.practice_questions || [];
    app.practiceQuestions = [...standardPracticeQuestions(genLang), ...aiQuestions].map(q=>({...q, userAnswer:'', feedback:'', sampleAnswer:'', fbLoading:false}));
    app.questionsForEmployer = parsed.questions_for_employer || [];
    await saveApplications();
  }catch(e){
    toast(t('toastQuestionsFailed'));
  }
  state.ui.qLoading = false;
  render();
}

async function getFeedback(i){
  const app = state.applications.find(a=>a.id===state.ui.interviewAppId);
  const q = app && app.practiceQuestions && app.practiceQuestions[i];
  if(!app || !q) return;
  const answerEl = document.getElementById('answer-'+i);
  const answer = answerEl ? answerEl.value.trim() : '';
  if(!answer){ toast(t('toastWriteAnswerFirst')); return; }
  q.userAnswer = answer;
  q.fbLoading = true; render();
  const genLangName = (state.ui.interviewGenLang || state.uiLang || 'en') === 'fr' ? 'French' : 'English';
  const prompt = `You are an interview coach. The candidate is preparing for a "${app.title}" role at "${app.company}". They were asked: "${q.question}" (category: ${q.category}). Their answer: "${answer}".

Give concise, specific, encouraging feedback (4-6 sentences max): what's strong, what's missing (e.g. structure like STAR for behavioral questions, specificity, relevance to the role), and one concrete way to improve it. Plain text only, no markdown. Write entirely in ${genLangName}.`;
  try{
    const fb = await callClaude(prompt);
    q.feedback = fb.trim();
    await saveApplications();
  }catch(e){
    toast(t('toastFeedbackFailed'));
  }
  q.fbLoading = false;
  render();
}
